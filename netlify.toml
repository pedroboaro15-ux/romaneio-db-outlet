[build]
  publish = "public"
  functions = "netlify/functions"

# SUPABASE_URL aparece de propósito tanto no código (public/index.html, pro navegador)
# quanto aqui como variável de ambiente (pras Functions) — não é segredo, é só o
# endereço público do projeto. Sem isso o Netlify bloqueia o deploy achando que vazou.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Ingestão diária dos pedidos de venda da Omie, que alimenta a aba Vendas.
# O horário do cron é sempre em UTC: 08:10 UTC = 05:10 na Paraíba. Roda de
# madrugada, então quando alguém abre o painel de manhã o número já está lá.
# A função reprocessa os últimos dias (não só ontem) pra pegar pedido lançado atrasado.
[functions."ingerir-pedidos-omie"]
  schedule = "10 8 * * *"

# Links dos freteiros e estoquistas: /entrega/<id> e /separacao/<id>
# (sem id, /entrega e /separacao mostram a lista de rotas de quem logou)
[[redirects]]
  from = "/entrega"
  to = "/entrega.html"
  status = 200

[[redirects]]
  from = "/entrega/*"
  to = "/entrega.html"
  status = 200

[[redirects]]
  from = "/separacao"
  to = "/separacao.html"
  status = 200

[[redirects]]
  from = "/separacao/*"
  to = "/separacao.html"
  status = 200

# Página de entrada única da equipe (freteiro/estoquista escolhem quem são e entram
# só com o telefone). É pra cá que as telas mandam quem chega sem sessão.
[[redirects]]
  from = "/equipe"
  to = "/equipe.html"
  status = 200
