[build]
  publish = "public"
  functions = "netlify/functions"

# SUPABASE_URL aparece de propósito tanto no código (public/index.html, pro navegador)
# quanto aqui como variável de ambiente (pras Functions) — não é segredo, é só o
# endereço público do projeto. Sem isso o Netlify bloqueia o deploy achando que vazou.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Links dos freteiros e estoquistas: /entrega/<id> e /separacao/<id>
[[redirects]]
  from = "/entrega/*"
  to = "/entrega.html"
  status = 200

[[redirects]]
  from = "/separacao/*"
  to = "/separacao.html"
  status = 200

# Folha de impressão: /romaneio/<id>/imprimir
[[redirects]]
  from = "/romaneio/:id/imprimir"
  to = "/.netlify/functions/romaneio-imprimir?id=:id"
  status = 200
