<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Separação — Outlet dos Móveis DB</title>
<link rel="icon" href="/logo.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f4f0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#14140F;padding-bottom:30px}
header{background:#14140F;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
.hcima{display:flex;align-items:center;gap:10px}
.hcima img{width:36px;height:36px;border-radius:7px;flex:0 0 auto}
header h1{font-size:17px;margin:0;flex:1;min-width:0}
header p{margin:6px 0 0;font-size:13px;color:#c9c9bd}
.prog{height:6px;background:#ffffff26;border-radius:3px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:#F2F250;width:0;transition:.3s}
main{padding:12px}
.p{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;border:1px solid #e2e2d9}
.p .n{display:inline-block;background:#efefe6;color:#6f6f66;font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px}

/* Número do pedido é a informação que o estoquista cruza com a nota na mão — destaque total. */
.pedidodest{display:inline-block;background:#F2F250;color:#14140F;font-weight:900;font-size:23px;line-height:1.2;padding:7px 15px;border-radius:10px;margin:10px 0 2px;letter-spacing:-.01em}

/* ---- COR: a informação mais errada de se errar. Fundo preto, cor em amarelo, ---- */
/* ---- mostrinha grande com borda branca. Dá pra ler de longe e no escuro.     ---- */
.corbox{margin:14px 0 10px;background:#14140F;border-radius:15px;padding:16px}
.corlinha{display:flex;align-items:center;gap:15px}
.corbox .swbig{width:88px;height:88px;border-radius:13px;border:3px solid #fff;flex:0 0 auto}
.corbox .txt{flex:1;min-width:0}
.corbox .rot{font-size:11px;color:#b9b9ae;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.corbox .nome{font-size:29px;font-weight:900;color:#F2F250;text-transform:uppercase;line-height:1.1;word-break:break-word;margin-top:3px}
.corbox .semcor{font-size:19px;font-weight:800;color:#b9b9ae;text-transform:none;margin-top:3px}
.btnouvircor{margin-top:13px;width:100%;background:#ffffff26;color:#fff;font-size:14px;font-weight:700;padding:12px;border-radius:9px}
.misturado{background:#fdeaea;border:2px solid #eba9a9;color:#7f1d1d;border-radius:11px;padding:11px 13px;font-size:14px;font-weight:800;margin-bottom:4px}

/* Lista de itens do pedido, cada um com sua cor bem visível. */
.itemlinha{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eeeee4}
.itemlinha:last-child{border-bottom:0}
.itemlinha .swmed{width:32px;height:32px;border-radius:8px;border:2px solid #9a9a8e;flex:0 0 auto}
.itemlinha .desc{flex:1;min-width:0;font-size:14px;font-weight:600}
.itemlinha .corpill{font-weight:800;font-size:12px;text-transform:uppercase;background:#F2F250;color:#14140F;padding:3px 9px;border-radius:7px;white-space:nowrap;flex:0 0 auto}
.itemlinha .corpill.vazio{background:#efefe6;color:#8a8a7e}
.blocoitens{margin:12px 0;padding:4px 12px;background:#fafaf4;border:1px solid #eaeadf;border-radius:11px}
.tituloitens{font-size:11px;color:#6f6f66;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:9px 0 0}

.aviso{border-radius:10px;padding:11px 13px;margin:10px 0;font-size:14px;font-weight:700}
.aviso.ultima{background:#fdeaea;color:#7f1d1d}
.aviso.primeira{background:#eafaf1;color:#215e3f}
.aviso.meio{background:#efefe6;color:#57574e}
.vol{margin-top:12px;background:#fafaf4;border:2px solid #e2e2d9;border-radius:11px;padding:15px 12px;text-align:center}
.vol b{display:block;font-size:32px;line-height:1.15;font-weight:900}
.vol span{font-size:11px;color:#6f6f66;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.volitem{text-align:center;font-size:15px;font-weight:800;margin-top:8px}
.obs{margin-top:10px;font-size:14px;background:#fff8e1;border:1px solid #f0e0a8;border-radius:9px;padding:10px 12px;font-weight:600}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fotos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.btnfoto{background:#fff;color:#14140F;border:2px solid #14140F;margin-top:10px}
button{padding:14px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.5}
.ok{background:#0f8a4a;color:#fff;font-size:16px}
.amarelo{background:#F2F250;color:#14140F;font-size:16px;font-weight:800}
.nav{display:flex;gap:8px;margin-top:10px}
.nav button{flex:1;padding:11px;font-size:13px;font-weight:700;background:#fff;color:#57574e;border:1px solid #ddd}
.done{background:#eafaf1;border:1px solid #c8ecd9;border-radius:10px;padding:12px;text-align:center;color:#215e3f;font-weight:800;margin-top:12px}
.empty{text-align:center;padding:40px;color:#6f6f66}
.err{background:#fdeaea;color:#7f1d1d;padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:10px}
.rota{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #e2e2d9;border-left:5px solid #F2F250;text-decoration:none;display:block;color:inherit}
.avisoOffline{background:#7a5416;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600}
.resumoLinha{border-bottom:1px solid #eeeee4;padding:12px 0}
.resumoLinha:last-of-type{border-bottom:0}
.mut{color:#6f6f66;font-size:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14140F;color:#F2F250;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="tela-app" hidden>
<div id="avisoOffline" class="avisoOffline" hidden></div>
<header>
  <div class="hcima">
    <img src="/logo.svg" alt="Outlet dos Móveis DB">
    <h1 id="titulo">Carregando…</h1>
    <button id="btnSair" style="width:auto;flex:none;padding:7px 11px;font-size:12px;background:#ffffff26;color:#fff">Sair</button>
  </div>
  <p id="sub"></p>
  <div class="prog"><i id="bar"></i></div>
</header>
<main id="lista"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rom = null, idAtual = null, ordemCarregamento = [], passo = 0, paradaAguardandoFoto = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }

function corParaSwatch(nome){
  const n = (nome||'').trim().toLowerCase();
  if(n==='branco') return '#ffffff';
  if(n==='off') return '#efe6d3';
  if(n==='nature') return '#a3744f';
  if(n==='nature/off') return 'linear-gradient(135deg,#a3744f 60%,#efe6d3 60%)';
  if(n==='off/nature') return 'linear-gradient(135deg,#a3744f 40%,#efe6d3 40%)';
  return n ? '#cbd5e1' : 'transparent';
}

// Fala em voz alta (a cor, principalmente) — ajuda quem tem dificuldade de leitura.
function falar(texto){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR'; u.rate = .85;
  speechSynthesis.speak(u);
}
// Guarda a cor da tela atual numa variável em vez de embutir no onclick — assim nome de
// cor com aspas/acento nunca quebra o botão.
let corAtual = '';
function ouvirCorAtual(){ falar(corAtual ? ('A cor é ' + corAtual) : 'Esse item está sem cor cadastrada'); }

class ErroOffline extends Error {}
async function api(url, opt){
  const token = localStorage.getItem('equipeToken');
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, token ? { Authorization: 'Bearer ' + token } : {});
  let r;
  try{ r = await fetch(url, opt); }
  catch(e){ throw new ErroOffline('sem conexão'); }
  // Sessão morreu (login removido do cadastro, por ex.): volta pro início em vez de
  // deixar a pessoa presa numa tela de erro que ela não sabe resolver.
  if(r.status === 401){
    localStorage.removeItem('equipeToken'); localStorage.removeItem('equipeTipo');
    location.href = '/equipe';
    throw new Error('sessão expirada');
  }
  const j = await r.json().catch(()=>({erro:'resposta inválida'}));
  if(!r.ok) throw new Error(j.erro || ('HTTP '+r.status));
  return j;
}

/* ---------------- fila offline ---------------- */
function filaOffline(){ try{ return JSON.parse(localStorage.getItem('filaOfflineSep')||'[]'); }catch(e){ return []; } }
function salvarFila(f){ localStorage.setItem('filaOfflineSep', JSON.stringify(f)); atualizarAvisoOffline(); }
function enfileirar(acao){ const f = filaOffline(); f.push(acao); salvarFila(f); }
function atualizarAvisoOffline(){
  const n = filaOffline().length;
  const el = document.getElementById('avisoOffline');
  el.hidden = n === 0;
  if(n) el.textContent = `📶 Sem internet — ${n} confirmação(ões) salva(s) no celular, serão enviadas quando o sinal voltar`;
}
async function processarFila(){
  const f = filaOffline();
  if(!f.length) return;
  const restam = [];
  for(const acao of f){
    try{ await fetch(acao.url, { method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+acao.token}, body: JSON.stringify(acao.body) }); }
    catch(e){ restam.push(acao); }
  }
  salvarFila(restam);
  if(restam.length < f.length){ toast('Confirmações pendentes enviadas!'); if(idAtual) carregar(); }
}
window.addEventListener('online', processarFila);

// Sem token? Manda pra /equipe, que é a única porta de entrada da equipe.
function checarSessao(){
  if(!localStorage.getItem('equipeToken')){ location.href = '/equipe'; return; }
  document.getElementById('tela-app').hidden = false;
  atualizarAvisoOffline(); processarFila(); iniciar();
}
document.getElementById('btnSair').onclick = () => {
  if(!confirm('Sair do app?')) return;
  localStorage.removeItem('equipeToken'); localStorage.removeItem('equipeTipo');
  location.href = '/equipe';
};

// Estoquista vê a(s) rota(s) de HOJE EM DIANTE — não some se já tiver rota criada pra depois.
// forcarLista = veio do botão "Voltar": mostra a lista mesmo tendo só uma rota, senão
// o botão parecia não fazer nada (reabria a mesma rota na hora).
async function iniciar(forcarLista){
  try{
    const rotas = await api('/.netlify/functions/minhas-rotas');
    if(!rotas.length){
      document.getElementById('titulo').textContent = 'Sem rota';
      document.getElementById('sub').textContent = '';
      document.getElementById('lista').innerHTML = '<div class="empty">Nenhuma rota criada ainda. Fale com o gerente.</div>';
      return;
    }
    if(rotas.length === 1 && !forcarLista){ idAtual = rotas[0].id; await carregar(); return; }
    document.getElementById('titulo').textContent = rotas.length === 1 ? 'Sua rota' : 'Rotas';
    document.getElementById('sub').textContent = rotas.length === 1 ? 'Só essa rota por enquanto:' : 'Escolha qual rota separar:';
    document.getElementById('bar').style.width = '0%';
    document.getElementById('lista').innerHTML = rotas.map(r => `
      <a class="rota" href="#" onclick="abrirRota('${r.id}');return false;">
        <span class="n">${esc(r.codigo)}</span>
        ${r.carregado?'<span class="n" style="background:#eafaf1;color:#215e3f">✓ já carregada</span>':''}
        <div style="font-size:18px;font-weight:800;margin-top:7px">${esc(r.freteiroNome||'sem freteiro')}</div>
        <div class="mut">${esc(r.data||'')} · ${r.totalParadas} parada(s)</div>
      </a>`).join('');
  }catch(e){
    document.getElementById('titulo').textContent = 'Sem internet';
    document.getElementById('lista').innerHTML = '<div class="empty">Não deu pra carregar a rota agora. Assim que voltar o sinal, tente de novo.</div>';
  }
}
function abrirRota(id){ idAtual = id; carregar(); }

// Carregar o caminhão é o CONTRÁRIO da ordem de entrega: quem sai primeiro do caminhão
// tem que ter entrado por último. Por isso mostramos a rota de trás pra frente aqui.
async function carregar(){
  try{
    rom = await api('/.netlify/functions/romaneio-publico?id='+idAtual);
    localStorage.setItem('romCacheSep_'+idAtual, JSON.stringify(rom));
    prepararOrdem();
    document.getElementById('titulo').textContent = 'Separação — Romaneio ' + rom.codigo;
    await avancarSeSemVolume();
    render();
  }catch(e){
    const cache = localStorage.getItem('romCacheSep_'+idAtual);
    if(cache){ rom = JSON.parse(cache); prepararOrdem(); render(); toast('Sem internet — mostrando a última rota salva no celular'); }
    else{ document.getElementById('titulo').textContent = 'Erro'; document.getElementById('lista').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  }
}
function prepararOrdem(){
  ordemCarregamento = [...rom.paradas].reverse();
  passo = ordemCarregamento.findIndex(p => !p.separado);
  if(passo === -1) passo = ordemCarregamento.length;
}

// Parada sem volume (ex: assistência sem peça) não tem o que confirmar — marca
// como separada sozinho e pula pra próxima, sem exigir clique.
async function avancarSeSemVolume(){
  while(passo < ordemCarregamento.length && (Number(ordemCarregamento[passo].volumes) || 0) === 0 && !ordemCarregamento[passo].separado){
    try{
      const atualizada = await api('/.netlify/functions/parada-separar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId: ordemCarregamento[passo].id }) });
      ordemCarregamento[passo] = { ...ordemCarregamento[passo], ...atualizada };
    }catch(e){ break; }
    passo++;
  }
}

// Descobre qual item corresponde ao N-ésimo volume confirmado, pra mostrar o nome
// do produto junto (ex: "Sofá 3 lugares — módulo 2 de 2"), não só um número solto.
function itemDoVolume(p, indice){
  let acumulado = 0;
  for(const it of (p.itens||[])){
    const v = Number(it.volumes) || 0;
    if(v <= 0) continue;
    if(indice < acumulado + v) return { item: it, unidade: indice - acumulado + 1, totalItem: v };
    acumulado += v;
  }
  return null;
}

function render(){
  const total = ordemCarregamento.length;
  const feitas = ordemCarregamento.filter(p=>p.separado).length;
  document.getElementById('sub').textContent = rom.data + ' · ' + feitas + '/' + total + ' separadas · carregando de trás pra frente';
  document.getElementById('bar').style.width = (total ? feitas/total*100 : 0) + '%';

  if(!total){ document.getElementById('lista').innerHTML = '<div class="empty">Sem paradas.</div>'; return; }

  if(paradaAguardandoFoto){ renderDialogoFoto(paradaAguardandoFoto); return; }

  if(rom.carregamento_confirmado){ renderResumoFinal(true); return; }
  if(passo >= total){ renderResumoFinal(false); return; }

  const p = ordemCarregamento[passo];
  const posicaoOriginal = rom.paradas.indexOf(p) + 1;
  const totalRota = rom.paradas.length;
  let aviso;
  if(posicaoOriginal === totalRota) aviso = { txt: 'ÚLTIMA entrega da rota — carregue esta AGORA, primeiro de todas', cls: 'ultima' };
  else if(posicaoOriginal === 1) aviso = { txt: 'PRIMEIRA entrega da rota — carregue por ÚLTIMO, vai ficar na frente pra tirar primeiro', cls: 'primeira' };
  else aviso = { txt: `Entrega ${posicaoOriginal} de ${totalRota} da rota`, cls: 'meio' };

  const rotulo = p.tipo==='assistencia' ? 'Assistência' : (p.tipo==='nf' ? 'NF' : 'Pedido');
  const total_vol = Number(p.volumes) || 0;
  const confirmados = Math.min(p.volumes_confirmados || 0, total_vol);
  const fotos = (p.fotos||[]).map(f=>`<a href="${f.url}" target="_blank"><img src="${f.url}"></a>`).join('');
  const proximoItem = total_vol > 0 && confirmados < total_vol ? itemDoVolume(p, confirmados) : null;

  // A cor mostrada em destaque é a do volume que ele vai pegar AGORA. Se não der pra saber
  // qual item é, cai pra cor da parada (campo legado) — nunca deixa a tela sem essa informação.
  const corAgora = proximoItem ? (proximoItem.item.cor || '') : (p.cor || '');
  corAtual = corAgora;
  const coresDoPedido = [...new Set((p.itens||[]).map(it=>(it.cor||'').trim()).filter(Boolean))];

  document.getElementById('lista').innerHTML = `
    <div class="p">
      <span class="n">Carregando ${passo+1} de ${total}</span>
      <div class="aviso ${aviso.cls}">${aviso.txt}</div>
      <div class="pedidodest">${rotulo} ${esc(p.numero||'—')}</div>

      ${coresDoPedido.length > 1 ? `<div class="misturado">⚠️ ATENÇÃO: esse pedido tem ${coresDoPedido.length} cores diferentes — confira uma por uma</div>` : ''}

      <div class="corbox">
        <div class="corlinha">
          <span class="swbig" style="background:${corParaSwatch(corAgora)}"></span>
          <div class="txt">
            <div class="rot">Cor deste volume</div>
            ${corAgora
              ? `<div class="nome">${esc(corAgora)}</div>`
              : `<div class="semcor">Sem cor cadastrada</div>`}
          </div>
        </div>
        <button class="btnouvircor" onclick="ouvirCorAtual()">🔊 Ouvir a cor</button>
      </div>

      ${proximoItem?`<div class="volitem">Pegue agora: ${esc(proximoItem.item.descricao||'')}${proximoItem.totalItem>1?' — parte '+proximoItem.unidade+' de '+proximoItem.totalItem:''}</div>`:''}

      ${(p.itens||[]).length ? `<div class="blocoitens">
        <div class="tituloitens">Tudo desse pedido</div>
        ${(p.itens||[]).map(it=>`<div class="itemlinha">
          <span class="swmed" style="background:${corParaSwatch(it.cor)}"></span>
          <span class="desc">${esc(it.quantidade)}x ${esc(it.descricao)}${it.volumes?` <span class="mut">(${it.volumes} vol.)</span>`:''}</span>
          <span class="corpill ${it.cor?'':'vazio'}">${esc(it.cor||'sem cor')}</span>
        </div>`).join('')}
      </div>` : ''}

      ${p.observacao?`<div class="obs">📌 Recado do gerente: ${esc(p.observacao)}</div>`:''}
      ${fotos?`<div class="fotos">${fotos}</div>`:''}
      ${total_vol > 0 ? `
        <div class="vol"><b>${confirmados} / ${total_vol}</b><span>volumes confirmados</span></div>
        ${confirmados < total_vol
          ? `<button class="ok" id="btnvol" style="margin-top:10px" onclick="confirmarVolume('${p.id}')">Confirmei o volume ${confirmados+1} de ${total_vol}</button>`
          : `<div class="done">✓ Separado</div>`}
      ` : `<div class="done" style="margin-top:10px">Sem volumes pra confirmar nessa parada</div>`}
      <div class="nav">
        <button onclick="irPara(${passo-1})" ${passo===0?'disabled':''}>◀ Anterior</button>
        <button onclick="irPara(${passo+1})">Pular ▶</button>
      </div>
    </div>`;
}

function renderResumoFinal(jaConfirmado){
  const linhas = rom.paradas.map((p,i) => {
    const rotulo = p.tipo==='assistencia' ? 'Assistência' : (p.tipo==='nf' ? 'NF' : 'Pedido');
    const itens = (p.itens||[]).length
      ? (p.itens||[]).map(it=>`<div class="itemlinha">
          <span class="swmed" style="background:${corParaSwatch(it.cor)}"></span>
          <span class="desc">${esc(it.quantidade)}x ${esc(it.descricao)}</span>
          <span class="corpill ${it.cor?'':'vazio'}">${esc(it.cor||'sem cor')}</span>
        </div>`).join('')
      : '<div class="mut" style="padding:8px 0">Sem itens cadastrados nesse pedido.</div>';
    return `<div class="resumoLinha">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <span class="pedidodest" style="font-size:18px;margin:0;padding:5px 11px">${rotulo} ${esc(p.numero||'—')}</span>
        <span class="n">${p.volumes||0} volume(s)</span>
      </div>
      ${itens}
    </div>`;
  }).join('');
  document.getElementById('lista').innerHTML = `
    <div class="p">
      <h3 style="text-align:center;font-size:20px;margin:0 0 4px">${jaConfirmado?'✓ Carregamento já confirmado':'✓ Tudo separado!'}</h3>
      <p style="text-align:center;color:#57574e;margin:0 0 10px">${jaConfirmado?'Confira se ficou tudo certo:':'Confira produto por produto antes de fechar o caminhão:'}</p>
      ${linhas}
      ${jaConfirmado
        ? `<div class="done" style="margin-top:14px">Carregamento confirmado ✓</div>
           <button style="margin-top:10px;background:#fff;border:2px solid #14140F;color:#14140F" onclick="voltarParaRotas()">◀ Voltar — ver outras rotas</button>`
        : `<button class="ok" style="margin-top:14px" onclick="confirmarCarregamento()">Confirmar carregamento</button>`}
    </div>`;
}

function voltarParaRotas(){ idAtual = null; rom = null; iniciar(true); }

async function confirmarCarregamento(){
  try{
    await api('/.netlify/functions/romaneio-carregado', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ romaneioId: idAtual }) });
    rom.carregamento_confirmado = true;
    toast('Carregamento confirmado!');
    render();
  }catch(e){ alert('Não deu pra confirmar agora: ' + e.message); }
}

async function irPara(i){
  if(i < 0) return;
  passo = i;
  await avancarSeSemVolume();
  render();
}

async function confirmarVolume(paradaId){
  const botao = document.getElementById('btnvol');
  if(botao && botao.disabled) return; // trava clique duplo (não conta o mesmo volume 2x)
  if(botao) botao.disabled = true;
  const i = ordemCarregamento.findIndex(x=>x.id===paradaId);
  try{
    const atualizada = await api('/.netlify/functions/parada-separar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId }) });
    if(i>=0) ordemCarregamento[i] = { ...ordemCarregamento[i], ...atualizada };
    if(atualizada.separado) paradaAguardandoFoto = ordemCarregamento[i>=0?i:passo];
    render();
  }catch(e){
    if(e instanceof ErroOffline){
      if(i>=0){
        const p = ordemCarregamento[i];
        const novoTotal = Math.min((p.volumes_confirmados||0)+1, Number(p.volumes)||1);
        p.volumes_confirmados = novoTotal;
        if(novoTotal >= (Number(p.volumes)||0)) p.separado = true;
        enfileirar({ url: '/.netlify/functions/parada-separar', body: { paradaId }, token: localStorage.getItem('equipeToken') });
        localStorage.setItem('romCacheSep_'+idAtual, JSON.stringify(rom));
        toast('Sem internet — confirmado no celular, será enviado quando voltar o sinal');
        if(p.separado) paradaAguardandoFoto = p;
      }
      render();
    } else {
      alert('Falha ao salvar: ' + e.message);
      if(botao) botao.disabled = false;
    }
  }
}

function renderDialogoFoto(p){
  document.getElementById('lista').innerHTML = `
    <div class="p">
      <h3 style="text-align:center;font-size:20px;margin:0 0 4px">✓ Separado!</h3>
      <div style="text-align:center"><span class="pedidodest">${esc(p.numero?('Pedido '+p.numero):'Parada')}</span></div>
      <p style="text-align:center;color:#57574e">Quer mandar uma foto?</p>
      <button class="ok" style="margin-bottom:10px" onclick="escolherTipoFoto('${p.id}','produto')">📦 Foto do produto</button>
      <button class="btnfoto" style="margin-bottom:10px;margin-top:0" onclick="escolherTipoFoto('${p.id}','carro')">🚚 Foto do carro</button>
      <button style="background:#fff;border:1px solid #ddd;color:#6f6f66" onclick="pularFoto()">Pular</button>
      <input type="file" id="fotoDialogo" accept="image/*" capture="environment" style="display:none">
    </div>`;
}

function escolherTipoFoto(paradaId, tipo){
  const input = document.getElementById('fotoDialogo');
  input.onchange = () => enviarFoto(paradaId, input.files[0], tipo);
  input.click();
}

async function avancarPassoDepoisDaFoto(){
  paradaAguardandoFoto = null;
  passo++;
  await avancarSeSemVolume();
  render();
}
function pularFoto(){ avancarPassoDepoisDaFoto(); }
function redimensionarImagem(file, maxLado){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxLado){ height = Math.round(height * maxLado/width); width = maxLado; }
      else if(height > maxLado){ width = Math.round(width * maxLado/height); height = maxLado; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function enviarFoto(paradaId, file, tipo){
  if(!file) return avancarPassoDepoisDaFoto();
  try{
    const imagemBase64 = await redimensionarImagem(file, 1280);
    await api('/.netlify/functions/foto-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, imagemBase64, tipo }) });
  }catch(e){ if(!(e instanceof ErroOffline)) alert('Falha ao enviar a foto: ' + e.message); else toast('Sem internet — foto não enviada, siga em frente'); }
  await avancarPassoDepoisDaFoto();
}

window.confirmarCarregamento = confirmarCarregamento;
