<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let rom = null, idAtual = null, ordemCarregamento = [], passo = 0, paradaAguardandoFoto = null;
let mostrandoVisaoGeral = false;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }

function corParaSwatch(nome){
  const n = (nome||'').trim().toLowerCase();
  if(n==='branco') return '#ffffff';
  if(n==='off') return '#efe6d3';
  if(n==='nature') return '#a3744f';
  if(n==='nature/off') return 'linear-gradient(135deg,#a3744f 60%,#efe6d3 60%)';
  if(n==='off/nature') return 'linear-gradient(135deg,#a3744f 40%,#efe6d3 40%)';
  return n ? '#cbd5e1' : 'transparent';
}

/* ---------------- onde cada móvel vai no caminhão ----------------
   A Omie não manda peso por item — só o peso total do pedido. Então o que dá pra usar
   é o NOME do produto, que é o que diz o que a coisa é de verdade (colchão é caro e leve,
   guarda-roupa é pesado). Se faltar algum produto seu nessas listas, é só pedir. */
const VAI_POR_CIMA = ['COLCHAO','ESPELHO','VIDRO','TAMPO','LUMINARIA','ABAJUR','QUADRO','PUFF','ALMOFADA','CABECEIRA'];
const VAI_EMBAIXO  = ['GUARDA','ROUPEIRO','ARMARIO','BASE','CAMA','RACK','BALCAO','BUFFET','COMODA','ESTANTE','MESA','SOFA','BANCADA','PAINEL','GELADEIRA','FOGAO'];
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function ondeVai(item){
  if(item && item.fragil) return 'cima'; // marcado "🔴 vidro" na mão: manda no nome do produto
  const d = semAcento(item && item.descricao);
  if(VAI_POR_CIMA.some(x=>d.includes(x))) return 'cima';
  if(VAI_EMBAIXO.some(x=>d.includes(x))) return 'baixo';
  return '';
}

class ErroOffline extends Error {}
async function api(url, opt){
  const token = localStorage.getItem('equipeToken');
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, token ? { Authorization: 'Bearer ' + token } : {});
  let r;
  try{ r = await fetch(url, opt); }
  catch(e){ throw new ErroOffline('sem conexão'); }
  // Sessão morreu (login removido do cadastro, por ex.): volta pro início em vez de
  // deixar a pessoa presa numa tela de erro que ela não sabe resolver.
  if(r.status === 401){
    localStorage.removeItem('equipeToken'); localStorage.removeItem('equipeTipo'); localStorage.removeItem('equipeNome');
    location.href = '/';
    throw new Error('sessão expirada');
  }
  const j = await r.json().catch(()=>({erro:'resposta inválida'}));
  if(!r.ok) throw new Error(j.erro || ('HTTP '+r.status));
  return j;
}

/* ---------------- fila offline ---------------- */
function filaOffline(){ try{ return JSON.parse(localStorage.getItem('filaOfflineSep')||'[]'); }catch(e){ return []; } }
function salvarFila(f){ localStorage.setItem('filaOfflineSep', JSON.stringify(f)); atualizarAvisoOffline(); }
function enfileirar(acao){ const f = filaOffline(); f.push(acao); salvarFila(f); }
function atualizarAvisoOffline(){
  const n = filaOffline().length;
  const el = document.getElementById('avisoOffline');
  el.hidden = n === 0;
  if(n) el.textContent = `📶 Sem internet — ${n} confirmação(ões) salva(s) no celular, serão enviadas quando o sinal voltar`;
}
async function processarFila(){
  const f = filaOffline();
  if(!f.length) return;
  const restam = [];
  for(const acao of f){
    try{ await fetch(acao.url, { method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+acao.token}, body: JSON.stringify(acao.body) }); }
    catch(e){ restam.push(acao); }
  }
  salvarFila(restam);
  if(restam.length < f.length){ toast('Confirmações pendentes enviadas!'); if(idAtual) carregar(); }
}
window.addEventListener('online', processarFila);

// Sem token? Manda pra raiz, que é a única porta de entrada de todo mundo.
function checarSessao(){
  if(!localStorage.getItem('equipeToken')){ location.href = '/'; return; }
  document.getElementById('tela-app').hidden = false;
  atualizarAvisoOffline(); processarFila(); iniciar();
  atualizarBotaoNotif();
}

function base64UrlParaBytes(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);

// Carregar o caminhão é o CONTRÁRIO da ordem de entrega: quem sai primeiro do caminhão
// tem que ter entrado por último. Por isso mostramos a rota de trás pra frente aqui.
async function carregar(){
  try{
    rom = await api('/.netlify/functions/romaneio-publico?id='+idAtual);
    localStorage.setItem('romCacheSep_'+idAtual, JSON.stringify(rom));

    await avancarSeSemVolume();
    render();
  }catch(e){
    const cache = localStorage.getItem('romCacheSep_'+idAtual);
    if(cache){ rom = JSON.parse(cache); prepararOrdem(); render(); toast('Sem internet — mostrando a última rota salva no celular'); }
    else{ document.getElementById('titulo').textContent = 'Erro'; document.getElementById('lista').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  }
}
function prepararOrdem(){
  ordemCarregamento = [...rom.paradas].reverse();
  passo = ordemCarregamento.findIndex(p => !p.separado);
  if(passo === -1) passo = ordemCarregamento.length;
  // Abre pela visão geral da carga (o "antes de começar"), a não ser que o carregamento
  // já esteja fechado — aí não tem mais o que planejar.
  mostrandoVisaoGeral = !rom.carregamento_confirmado;
}

/* ---- A FILA DE VOLUMES DE UMA PARADA ----
   Cópia fiel de filaDeVolumes() em netlify/functions/lib/carga.js. As duas
   PRECISAM concordar: o servidor decide se a parada fechou, a tela decide o que
   mostrar, e as duas leem o mesmo contador (volumes_confirmados, um número só).
   Se divergirem, a tela cobra um volume e o banco acha que é outro.

   A ordem é: primeiro o que vai agora, depois o que o estoquista mandou pro
   final ("vai por cima" — colchão, cama, espelho). Com os adiados no fim, o
   contador continua sendo um índice direto nesta lista. */
function filaDaParada(p){
  const itens = (p && p.itens) || [];
  const fila = [];
  const empilhar = porCima => {
    itens.forEach((it, indiceItem) => {
      if(it && it.jaNoFrete) return;              // já está no caminhão
      if(!!(it && it.adiado) !== porCima) return;
      const total = Number(it && it.volumes) || 0;
      for(let unidade = 1; unidade <= total; unidade++){
        fila.push({ item: it, indiceItem, unidade, totalItem: total, porCima });
      }
    });
  };
  empilhar(false);
  empilhar(true);
  return fila;
}

/** Em que pé está a parada. Mesmos nomes de situacaoParada() no servidor. */
function situacao(p){
  const fila = filaDaParada(p);
  const confirmados = Number(p && p.volumes_confirmados) || 0;
  const confirmarAgora = fila.filter(v => !v.porCima).length;
  return {
    fila, confirmados, confirmarAgora,
    confirmarTotal: fila.length,
    temPorCima: fila.length > confirmarAgora,
    prontoPorAgora: confirmados >= confirmarAgora,
    separado: confirmados >= fila.length
  };
}

/** Quanto esta parada ainda cobra NESTA passada (o que não foi adiado). */
function volumesEfetivos(p){ return situacao(p).confirmarAgora; }

/** Ainda tem móvel esperando pra ir por cima, em qualquer parada da rota? */
function pendentesPorCima(){
  return ordemCarregamento.filter(p => {
    const s = situacao(p);
    return s.confirmados < s.confirmarTotal && s.confirmados >= s.confirmarAgora;
  });
}

// Parada sem NADA pra confirmar (assistência sem peça, ou tudo já no frete) é
// marcada como separada sozinho. Parada que só tem adiado não é marcada — ela
// ainda deve; só sai da frente agora e volta na etapa do "por cima".
async function avancarSeSemVolume(){
  while(passo < ordemCarregamento.length){
    const p = ordemCarregamento[passo];
    const s = situacao(p);
    if(!s.prontoPorAgora) break;          // ainda tem volume pra confirmar agora
    if(s.separado){ passo++; continue; }  // já fechou de verdade

    if(s.confirmarTotal === 0){
      // Nada a confirmar nunca: fecha sozinho, sem exigir clique.
      try{
        const atualizada = await api('/.netlify/functions/parada-separar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId: p.id }) });
        // Object.assign (não spread) — ordemCarregamento e rom.paradas apontam pro MESMO
        // objeto de cada parada; trocar por um objeto novo aqui desalinhava os dois e a
        // tela de resumo (que lê rom.paradas) ficava com dado velho.
        Object.assign(p, atualizada);
      }catch(e){ break; }
    }
    passo++;
  }
}

// Descobre qual item corresponde ao N-ésimo volume da fila, pra mostrar o nome
// do produto junto (ex: "Sofá 3 lugares — módulo 2 de 2"), não só um número solto.
function itemDoVolume(p, indice){
  const v = filaDaParada(p)[indice];
  return v ? { item: v.item, indiceItem: v.indiceItem, unidade: v.unidade, totalItem: v.totalItem, porCima: v.porCima } : null;
}

/* ---- "vai por cima": tirar um móvel da vez dele e mandar pro fim ---- */
async function marcarPorCima(paradaId, indice, adiar){
  try{
    const atualizada = await api('/.netlify/functions/parada-item-adiar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ paradaId, indice, adiar })
    });
    const na = ordemCarregamento.find(x=>x.id===paradaId);
    if(na) Object.assign(na, atualizada);
    const no = rom.paradas.find(x=>x.id===paradaId);
    if(no) Object.assign(no, atualizada);
    toast(adiar ? 'Guardado pro final — vai por cima' : 'Trazido de volta pra fila');
    await avancarSeSemVolume();
    render();
  }catch(e){ alert(e.message); }
}

/* Palpite de quando sugerir "vai por cima". Só um aviso: quem decide é quem está
   olhando o móvel. A lista é curta de propósito — sugestão errada demais e as
   pessoas param de ler. */
const COSTUMA_IR_POR_CIMA = /colch[ãa]o|cama\b|box\b|espelho|cabeceira|travesseiro/i;

function render(){
  const total = ordemCarregamento.length;
  const feitas = ordemCarregamento.filter(p=>p.separado).length;
  document.getElementById('sub').textContent = rom.data + ' · ' + feitas + '/' + total + ' separadas · carregando de trás pra frente';
  document.getElementById('bar').style.width = (total ? feitas/total*100 : 0) + '%';

  if(!total){ document.getElementById('lista').innerHTML = '<div class="empty">Sem paradas.</div>'; return; }

  if(paradaAguardandoFoto){ renderDialogoFoto(paradaAguardandoFoto); return; }

  if(rom.carregamento_confirmado){ renderResumoFinal(true); return; }
  // A conferência tem prioridade sobre tudo enquanto estiver aberta.
  if(conf){ renderConferencia(); return; }
  if(mostrandoVisaoGeral){ renderVisaoGeral(); return; }
  // Acabou a passada normal. Se sobrou móvel marcado como "vai por cima", ele
  // volta AGORA — com o caminhão quase cheio, que é quando faz sentido pôr
  // colchão em cima de tudo.
  if(passo >= total){
    if(pendentesPorCima().length){ renderPorCima(); return; }
    renderResumoFinal(false);
    return;
  }

  const p = ordemCarregamento[passo];
  const posicaoOriginal = rom.paradas.indexOf(p) + 1;
  const totalRota = rom.paradas.length;
  let aviso;
  if(posicaoOriginal === totalRota) aviso = { txt: 'última entrega · vai no fundo', cls: 'ultima' };
  else if(posicaoOriginal === 1) aviso = { txt: 'primeira entrega · fica na porta', cls: 'primeira' };
  else aviso = { txt: `entrega ${posicaoOriginal} de ${totalRota}`, cls: 'meio' };

  const rotulo = p.tipo==='assistencia' ? 'Assistência' : (p.tipo==='nf' ? 'NF' : 'Pedido');
  const total_vol = volumesEfetivos(p);
  const confirmados = Math.min(p.volumes_confirmados || 0, total_vol);
  const fotos = (p.fotos||[]).map(f=>`<a href="${f.url}" target="_blank"><img src="${f.url}"></a>`).join('');
  const proximoItem = total_vol > 0 && confirmados < total_vol ? itemDoVolume(p, confirmados) : null;

  // A cor mostrada em destaque é a do volume que ele vai pegar AGORA. Se não der pra saber
  // qual item é, cai pra cor da parada (campo legado) — nunca deixa a tela sem essa informação.
  const corAgora = proximoItem ? (proximoItem.item.cor || '') : (p.cor || '');
  const coresDoPedido = [...new Set((p.itens||[]).filter(it=>!it.jaNoFrete).map(it=>(it.cor||'').trim()).filter(Boolean))];

  // Mudou de produto dentro do mesmo pedido? (ex: acabaram os 2 volumes da bancada,
  // agora começam os da base). É onde mais se erra, então avisa na cara.
  const itemAnterior = confirmados > 0 ? itemDoVolume(p, confirmados - 1) : null;
  const trocouProduto = proximoItem && itemAnterior && itemAnterior.item !== proximoItem.item;
  // Primeiro volume desta parada = acabou o pedido anterior, começou outro.
  const trocouPedido = confirmados === 0 && passo > 0;

  document.getElementById('lista').innerHTML = `
    <div class="p">
      <span class="n">Carregando ${passo+1} de ${total}</span>
      <span class="tagpos ${aviso.cls}">${aviso.txt}</span>

      ${trocouPedido ? `<div class="trocou pedido">🔄 Acabou o pedido anterior. Agora é outro pedido:</div>` : ''}
      <div class="pedidodest">${rotulo} ${esc(p.numero||'—')}</div>

      ${coresDoPedido.length > 1 ? `<div class="misturado">⚠️ ATENÇÃO: esse pedido tem ${coresDoPedido.length} cores diferentes — confira uma por uma</div>` : ''}
      ${trocouProduto ? `<div class="trocou produto">🔄 Mudou de produto! Os volumes de <b>${esc(itemAnterior.item.descricao||'')}</b> acabaram. Agora é <b>${esc(proximoItem.item.descricao||'')}</b> — confira a cor de novo.</div>` : ''}
      ${(proximoItem && proximoItem.item.fragil) ? `
      <div class="vidrocheck">
        <div class="vidrocheck-titulo">🔴 Este volume é vidro — pegue com cuidado e deixe por cima de tudo</div>
        <label class="checkvidro">
          <input type="checkbox" id="chkVidroOk" onchange="atualizarBotaoVolume()"> Conferi — o vidro não está quebrado
        </label>
        <button type="button" class="btnquebrado" onclick="reportarVidroQuebrado('${p.id}')">🔴 Está quebrado — avisar o gerente</button>
      </div>` : ''}

      <div class="corcard">
        <div class="corchip" style="background:${corParaSwatch(corAgora)}"></div>
        <div class="cornome">
          <div class="rot">Cor do produto</div>
          ${corAgora
            ? `<div class="nome">${esc(corAgora)}</div>`
            : `<div class="semcor">Sem cor cadastrada</div>`}
        </div>
      </div>

      ${proximoItem?`<div class="volitem">Pegue agora: ${esc(proximoItem.item.descricao||'')}${proximoItem.totalItem>1?' — parte '+proximoItem.unidade+' de '+proximoItem.totalItem:''}</div>`:''}

      ${proximoItem && !proximoItem.porCima ? `
        ${COSTUMA_IR_POR_CIMA.test(proximoItem.item.descricao||'') ? '<div class="dicaporcima">⬆️ Esse costuma ir por cima. Se for o caso, mande pro final — assim ele não fica embaixo de guarda-roupa.</div>' : ''}
        <button type="button" class="btnporcima" onclick="marcarPorCima('${p.id}', ${proximoItem.indiceItem}, true)">
          ⬆️ Vai por cima — deixar pro final
        </button>` : ''}

      ${(p.itens||[]).length ? `<div class="blocoitens">
        <div class="tituloitens">Tudo desse pedido</div>
        ${(p.itens||[]).map(it=>`<div class="itemlinha ${it.jaNoFrete?'jafrete':''}">
          <span class="swmed" style="background:${corParaSwatch(it.cor)}"></span>
          <span class="desc">${esc(it.quantidade)}x ${esc(it.descricao)}${it.fragil?' <span class="selovidro">🔴 VIDRO</span>':''}${it.volumes?` <span class="mut">(${it.volumes} vol.)</span>`:''}</span>
          ${it.jaNoFrete
            ? '<span class="chipnofrete">✓ já no frete</span>'
            : it.adiado
              ? '<span class="chipporcima">⬆️ vai por cima</span>'
              : `<span class="corpill ${it.cor?'':'vazio'}">${esc(it.cor||'sem cor')}</span>`}
        </div>`).join('')}
      </div>` : ''}

      ${p.observacao?`<div class="obs">📌 Recado do gerente: ${esc(p.observacao)}</div>`:''}
      ${fotos?`<div class="fotos">${fotos}</div>`:''}
      ${total_vol > 0 ? `
        <div class="vol"><b>${confirmados} / ${total_vol}</b><span>volumes confirmados</span></div>
        ${confirmados < total_vol
          ? `<button class="ok" id="btnvol" ${(proximoItem && proximoItem.item.fragil)?'disabled':''} style="margin-top:10px" onclick="confirmarVolume('${p.id}')">Confirmei o volume ${confirmados+1} de ${total_vol}</button>`
          : `<div class="done">✓ Separado</div>`}
      ` : `<div class="done" style="margin-top:10px">Sem volumes pra confirmar nessa parada</div>`}
      <div class="nav">
        <button onclick="irPara(${passo-1})" ${passo===0?'disabled':''}>◀ Anterior</button>
        <button onclick="verVisaoGeral()">📋 Ver a carga</button>
        <button onclick="irPara(${passo+1})">Pular ▶</button>
      </div>
    </div>`;
}

/* ---------------- visão geral da carga (antes de começar a separar) ----------------
   Junta tudo que vai no caminhão, do mais caro pro mais barato, e diz o que precisa ir
   por cima. O detalhe que importa: carregar é LIFO — a última entrega entra primeiro e
   fica no fundo. Então um colchão da última entrega tem que ir por cima MAS entra
   primeiro: é justamente aí que dá briga com o freteiro. O app aponta esse caso. */
function itensDaCarga(){
  const itens = [];
  rom.paradas.forEach((p, i) => {
    const posCarregamento = ordemCarregamento.indexOf(p); // 0 = entra primeiro = fundo
    (p.itens||[]).forEach((it, idx) => {
      itens.push({
        paradaId: p.id,
        indice: idx,
        descricao: it.descricao || '(sem descrição)',
        cor: it.cor || '',
        quantidade: Number(it.quantidade) || 0,
        volumes: Number(it.volumes) || 0,
        valor: Number(it.valorTotal) || 0,
        pedido: p.numero || '',
        entrega: i + 1,
        posCarregamento,
        onde: ondeVai(it),
        fragil: !!it.fragil,
        jaNoFrete: !!it.jaNoFrete
      });
    });
  });
  return itens.sort((a,b) => b.valor - a.valor);
}

function renderVisaoGeral(){
  const itens = itensDaCarga();
  const totalVol = rom.paradas.reduce((s,p)=>s+volumesEfetivos(p), 0);
  const totalValor = itens.reduce((s,it)=>s+it.valor, 0);
  const ultimoACarregar = ordemCarregamento.length - 1;

  // "Vai por cima" mas entra cedo no caminhão = alguém vai empilhar coisa em cima dele.
  const conflitos = itens.filter(it => it.onde === 'cima' && it.posCarregamento < ultimoACarregar);

  // As setinhas de cima/embaixo em toda linha viraram poluição visual — o que importa de
  // verdade é só avisar quando dá conflito de verdade (aviso acima). A lista aqui fica
  // só o panorama: produto, cor, pedido, volumes e valor.
  const linhas = itens.map(it => `
    <div class="itemlinha ${it.jaNoFrete?'jafrete':''}">
      <span class="swmed" style="background:${corParaSwatch(it.cor)}"></span>
      <span class="desc">${esc(it.descricao)}${it.fragil?' <span class="selovidro">🔴 VIDRO</span>':''}
        <div class="mut">Pedido ${esc(it.pedido)} · entrega ${it.entrega} de ${rom.paradas.length}${it.volumes?' · '+it.volumes+' vol.':''}${it.valor?' · '+money(it.valor):''}</div>
      </span>
      <button type="button" class="botaonofrete ${it.jaNoFrete?'marcado':''}" onclick="marcarJaNoFrete('${it.paradaId}',${it.indice},${!it.jaNoFrete})">
        ${it.jaNoFrete?'✓ já no frete':'📦 já no frete?'}
      </button>
    </div>`).join('') || '<div class="mut" style="padding:10px 0">Nenhum item cadastrado nessa rota.</div>';

  const jaComecou = ordemCarregamento.some(p=>p.separado || (p.volumes_confirmados||0) > 0);
  const comRecado = rom.paradas.filter(p=>p.observacao);

  document.getElementById('lista').innerHTML = `
    <div class="p">
      <h3 style="margin:0 0 2px;font-size:20px">Visão geral da carga</h3>
      <div class="mut">${rom.paradas.length} pedido(s) · ${totalVol} volume(s)${totalValor?' · '+money(totalValor):''}</div>

      ${comRecado.length ? comRecado.map(p=>`<div class="obs">📌 Recado do gerente (pedido ${esc(p.numero||'—')}): ${esc(p.observacao)}</div>`).join('') : ''}

      ${conflitos.length ? `<div class="misturado" style="margin-top:12px">
        ⚠️ CUIDADO AO EMPILHAR
        ${conflitos.map(c=>`<div style="font-weight:600;margin-top:7px">
          <b>${esc(c.descricao)}</b> (pedido ${esc(c.pedido)}) tem que ir por cima, mas é a entrega ${c.entrega} de ${rom.paradas.length} — entra cedo no caminhão e fica embaixo. Combine com o freteiro antes de carregar.
        </div>`).join('')}
      </div>` : ''}

      <div class="blocoitens" style="margin-top:12px">
        <div class="tituloitens">Do mais caro pro mais barato</div>
        <p class="mut" style="padding:8px 0 0;margin:0">Já separou algum desses num outro estoque? Toque em "já no frete" — some da conferência, sem precisar confirmar de novo.</p>
        ${linhas}
      </div>

      <button class="amarelo" style="margin-top:12px" onclick="comecarSeparacao()">${jaComecou?'Continuar separando ▶':'Começar a separar ▶'}</button>
    </div>`;
}
function comecarSeparacao(){ mostrandoVisaoGeral = false; render(); }
function verVisaoGeral(){ mostrandoVisaoGeral = true; render(); }

async function marcarJaNoFrete(paradaId, indice, jaNoFrete){
  try{
    const atualizada = await api('/.netlify/functions/parada-item-carregado', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, indice, jaNoFrete }) });
    const p = rom.paradas.find(x=>x.id===paradaId);
    if(p) Object.assign(p, atualizada);
    const noArray = ordemCarregamento.find(x=>x.id===paradaId);
    if(noArray) Object.assign(noArray, atualizada);
    passo = ordemCarregamento.findIndex(x => !x.separado);
    if(passo === -1) passo = ordemCarregamento.length;
    toast(jaNoFrete ? 'Marcado como já no frete' : 'Desmarcado');
    render();
  }catch(e){ alert('Não foi possível marcar: ' + e.message); }
}

function renderResumoFinal(jaConfirmado){
  const linhas = rom.paradas.map((p,i) => {
    const rotulo = p.tipo==='assistencia' ? 'Assistência' : (p.tipo==='nf' ? 'NF' : 'Pedido');
    const itens = (p.itens||[]).length
      ? (p.itens||[]).map(it=>`<div class="itemlinha ${it.jaNoFrete?'jafrete':''}">
          <span class="swmed" style="background:${corParaSwatch(it.cor)}"></span>
          <span class="desc">${esc(it.quantidade)}x ${esc(it.descricao)}${it.fragil?' <span class="selovidro">🔴 VIDRO</span>':''}</span>
          ${it.jaNoFrete
            ? '<span class="chipnofrete">✓ já no frete</span>'
            : it.adiado
              ? '<span class="chipporcima">⬆️ vai por cima</span>'

      : '<div class="mut" style="padding:8px 0">Sem itens cadastrados nesse pedido.</div>';
    // Só dá pra desfazer volume enquanto o carregamento ainda não foi confirmado —

    return `<div class="resumoLinha">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <span class="pedidodest" style="font-size:18px;margin:0;padding:5px 11px">${rotulo} ${esc(p.numero||'—')}</span>
        <span class="n">${p.volumes||0} volume(s)</span>
      </div>
      ${p.observacao?`<div class="obs">📌 Recado do gerente: ${esc(p.observacao)}</div>`:''}
      ${itens}
      ${podeDesfazer?`<button type="button" class="desfazervol" onclick="desfazerVolumeResumo('${p.id}')">↩️ Desfazer último volume separado</button>`:''}
    </div>`;
  }).join('');
  document.getElementById('lista').innerHTML = `
    <div class="p">
      <h3 style="text-align:center;font-size:20px;margin:0 0 4px">${jaConfirmado?'✓ Carregamento já confirmado':'✓ Tudo separado!'}</h3>
      <p style="text-align:center;color:#57574e;margin:0 0 10px">${jaConfirmado?'Confira se ficou tudo certo:':'Confira produto por produto antes de fechar o caminhão:'}</p>
      ${linhas}
      ${jaConfirmado
        ? `<div class="done" style="margin-top:14px">Carregamento confirmado ✓</div>
           <button style="margin-top:10px;background:#fff;border:2px solid #b91c1c;color:#b91c1c" onclick="desfazerCarregamento()">↩️ Desfazer carregamento</button>
           <button style="margin-top:10px;background:#fff;border:2px solid #14140F;color:#14140F" onclick="voltarParaRotas()">◀ Voltar — ver outras rotas</button>`
        : rom.conferencia_ok
          // Já conferiu: não obriga a contar tudo de novo, mas deixa reconferir.
          ? `<div class="confok" style="margin-top:14px">✓ Conferência final já bateu</div>
             <button class="ok" onclick="confirmarCarregamento()">Confirmar carregamento</button>
             <button class="btnsec" onclick="abrirConferencia()">Conferir de novo</button>`
          // O caminho normal. A lista acima é por PEDIDO e serve pra revisar; a
          // conferência é por PRODUTO, com o caminhão já carregado, e é ela que
          // pega móvel trocado — porque é assim que a carga se parece de fora.
          : `<button class="ok" style="margin-top:14px" onclick="abrirConferencia()">Fazer a conferência final ▶</button>
             <div class="mut" style="text-align:center;font-size:13px;margin-top:8px">Com o caminhão carregado, você conta produto por produto. Leva um minuto e é o que pega móvel trocado.</div>`}
    </div>`;
}

/* ================= O QUE VAI POR CIMA =================
   Etapa entre "separei tudo" e a conferência final. Mostra, um por vez, os
   móveis que o estoquista tirou da fila durante a separação.

   A ordem aqui é a MESMA da separação (ordemCarregamento, que é a ordem de
   entrega ao contrário) e isso não é detalhe: entre os que vão por cima, o da
   última entrega também entra primeiro. Senão resolveríamos o problema do peso
   e criaríamos o do acesso — o freteiro teria que desenterrar o colchão da
   primeira parada. */
function renderPorCima(){
  const pendentes = pendentesPorCima();
  const p = pendentes[0];
  const s = situacao(p);
  const volume = s.fila[s.confirmados];

  const totalPorCima = ordemCarregamento.reduce((soma, x) => {
    const sx = situacao(x);
    return soma + Math.max(sx.confirmarTotal - Math.max(sx.confirmados, sx.confirmarAgora), 0);
  }, 0);
  const jaFeitos = ordemCarregamento.reduce((soma, x) => {
    const sx = situacao(x);
    return soma + Math.max(sx.confirmados - sx.confirmarAgora, 0);
  }, 0);

  const rotulo = p.tipo==='assistencia' ? 'Assistência' : 'Pedido';
  const posicaoOriginal = rom.paradas.indexOf(p) + 1;

  document.getElementById('lista').innerHTML = `
    <div class="porcimacabeca">
      <h3>⬆️ Agora o que vai por cima</h3>
      <p>O resto já está no caminhão. Estes ${totalPorCima + jaFeitos} volume(s) você guardou pro final — ponha por cima de tudo, sem peso em cima.</p>
    </div>
    <div class="p">
      <span class="n">Faltam ${totalPorCima} de ${totalPorCima + jaFeitos}</span>
      <span class="tagpos meio">entrega ${posicaoOriginal} de ${rom.paradas.length}</span>

      <div class="pedidodest">${rotulo} ${esc(p.numero||'—')}</div>

      ${volume && volume.item.fragil ? `
      <div class="vidrocheck">
        <div class="vidrocheck-titulo">🔴 Este volume é vidro — pegue com cuidado e deixe por cima de tudo</div>
        <label class="checkvidro">
          <input type="checkbox" id="chkVidroOk" onchange="atualizarBotaoVolume()"> Conferi — o vidro não está quebrado
        </label>
        <button type="button" class="btnquebrado" onclick="reportarVidroQuebrado('${p.id}')">🔴 Está quebrado — avisar o gerente</button>
      </div>` : ''}

      <div class="corcard">
        <div class="corchip" style="background:${corParaSwatch(volume ? volume.item.cor : '')}"></div>
        <div class="cornome">
          <div class="rot">Cor do produto</div>
          ${volume && volume.item.cor
            ? `<div class="nome">${esc(volume.item.cor)}</div>`
            : `<div class="semcor">Sem cor cadastrada</div>`}
        </div>
      </div>

      ${volume ? `<div class="volitem">Ponha por cima: ${esc(volume.item.descricao||'')}${volume.totalItem>1?' — parte '+volume.unidade+' de '+volume.totalItem:''}</div>` : ''}

      <button class="ok" id="btnvol" ${(volume && volume.item.fragil)?'disabled':''} style="margin-top:10px" onclick="confirmarVolume('${p.id}')">
        Coloquei por cima ${volume && volume.totalItem>1 ? '('+volume.unidade+' de '+volume.totalItem+')' : ''}
      </button>

      <button type="button" class="btnsec" onclick="marcarPorCima('${p.id}', ${volume ? volume.indiceItem : 0}, false)">
        ↩️ Trazer de volta pra fila normal
      </button>
    </div>

    ${pendentes.length > 1 ? `<div class="p" style="padding:13px">
      <div class="mut" style="font-weight:800;font-size:13px;margin-bottom:6px">Depois deste, ainda vão por cima:</div>
      ${pendentes.slice(1).map(x => {
        const sx = situacao(x);
        const v = sx.fila[sx.confirmados];
        const rot = x.tipo==='assistencia' ? 'Assistência' : 'Pedido';
        return `<div class="itemlinha">
          <span class="swmed" style="background:${corParaSwatch(v ? v.item.cor : '')}"></span>
          <span class="desc">${esc(v ? v.item.descricao : '')} <span class="mut">(${rot} ${esc(x.numero||'')})</span></span>
          <span class="chipporcima">⬆️ por cima</span>
        </div>`;
      }).join('')}
    </div>` : ''}`;
}

/* ================= CONFERÊNCIA FINAL =================
   Última etapa antes de fechar o caminhão. Três estados:
     conf = null            -> não está na conferência
     conf.fase = 'contando' -> lista de produtos pra contar, sem número na tela
     conf.fase = 'resultado'-> o que bateu e o que não bateu

   A lista é por PRODUTO, não por pedido, e isso é o ponto. Com o caminhão
   carregado ninguém enxerga pedido, enxerga móvel empilhado — conferir por
   pedido obrigaria a andar pedido por pedido na cabeça, que é onde se erra. */
let conf = null;

/** "falta 1" / "faltam 2" — a tela fala com gente, não com banco de dados. */
function plural(n, verbo){
  return n === 1 ? `${verbo} 1` : `${verbo}m ${n}`;
}

async function abrirConferencia(){
  try{
    const dados = await api('/.netlify/functions/conferencia-final?romaneioId=' + encodeURIComponent(idAtual));
    conf = { fase:'contando', ...dados, contagem:{}, resultado:null };
    render();
  }catch(e){ alert('Não deu pra abrir a conferência: ' + e.message); }
}

function sairDaConferencia(){ conf = null; render(); }

function mudarContagem(id, delta){
  const atual = conf.contagem[id];
  const base = Number.isFinite(Number(atual)) && atual !== '' ? Number(atual) : 0;
  const novo = Math.max(0, base + delta);
  conf.contagem[id] = novo;
  const campo = document.getElementById('cnt-' + id);
  if(campo) campo.value = novo;
  const caixa = document.getElementById('lin-' + id);
  if(caixa) caixa.classList.add('preenchida');
  atualizarBotaoConferir();
}

function digitouContagem(id, valor){
  if(valor === ''){ delete conf.contagem[id]; }
  else {
    const n = Math.max(0, Math.min(9999, Math.floor(Number(valor) || 0)));
    conf.contagem[id] = n;
  }
  const caixa = document.getElementById('lin-' + id);
  if(caixa) caixa.classList.toggle('preenchida', conf.contagem[id] !== undefined);
  atualizarBotaoConferir();
}

function atualizarBotaoConferir(){
  const btn = document.getElementById('btnConferir');
  if(!btn) return;
  const faltam = conf.linhas.filter(l => conf.contagem[l.id] === undefined).length;
  btn.disabled = faltam > 0;
  btn.textContent = faltam > 0
    ? ('Falta contar ' + faltam + ' produto' + (faltam > 1 ? 's' : ''))
    : 'Conferir a contagem';
}

async function enviarConferencia(){
  const btn = document.getElementById('btnConferir');
  if(btn){ btn.disabled = true; btn.textContent = 'Conferindo…'; }
  try{
    const r = await api('/.netlify/functions/conferencia-final', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ romaneioId: idAtual, versao: conf.versao, contagem: conf.contagem })
    });
    conf.fase = 'resultado';
    conf.resultado = r;
    if(r.ok) rom.conferencia_ok = true;
    render();
  }catch(e){
    // 409: você mexeu na rota pelo painel enquanto ele contava. A contagem dele
    // valia pra uma carga que não existe mais — recomeça com a lista nova.
    if(/carga mudou/i.test(e.message)){
      alert('A rota mudou enquanto você contava (entrou ou saiu pedido). Vou abrir a lista nova pra conferir de novo.');
      abrirConferencia();
      return;
    }
    alert('Não deu pra conferir: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Conferir a contagem'; }
  }
}

function recontar(){
  // Mantém só o que bateu: recontar tudo de novo seria castigo, e quem está
  // cansado no fim do dia acaba chutando. O que errou volta em branco.
  const erradas = new Set((conf.resultado.divergencias || []).map(d => d.id));
  for(const id of Object.keys(conf.contagem)) if(erradas.has(id)) delete conf.contagem[id];
  conf.fase = 'contando';
  conf.soAsErradas = erradas;
  render();
}

async function fecharComDivergencia(){
  const motivo = (document.getElementById('motivoDiverg') || {}).value || '';
  if(motivo.trim().length < 5){
    alert('Escreva o que está faltando ou sobrando — é isso que o gerente vai ler.');
    return;
  }
  if(!confirm('Fechar o carregamento com a conta não batendo?\n\nIsso fica marcado no romaneio e o gerente é avisado.')) return;
  try{
    await api('/.netlify/functions/romaneio-carregado', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ romaneioId: idAtual, mesmoComDivergencia: true, motivo })
    });
    rom.carregamento_confirmado = true;
    conf = null;
    toast('Carregamento fechado com ressalva');
    render();
  }catch(e){ alert('Não deu pra fechar: ' + e.message); }
}

function renderConferencia(){
  const el = document.getElementById('lista');

  /* ---------------- fase 1: contando às cegas ---------------- */
  if(conf.fase === 'contando'){
    const soErradas = conf.soAsErradas;
    const linhas = conf.linhas.filter(l => !soErradas || soErradas.has(l.id));

    el.innerHTML = `
      <div class="confcabeca">
        <h3>${soErradas ? 'Conta de novo, só o que não bateu' : 'Conferência final'}</h3>
        <p>${soErradas
          ? 'Só estes produtos. Conte olhando o caminhão, sem pressa.'
          : 'Olhe o caminhão carregado e conte quantos volumes de cada produto estão lá. Não tem resposta na tela de propósito — é a contagem que vale.'}</p>
      </div>
      ${linhas.map(l => `
        <div class="conflinha ${conf.contagem[l.id] !== undefined ? 'preenchida' : ''}" id="lin-${l.id}">
          <div class="confprod">
            <span class="swmed" style="background:${corParaSwatch(l.cor)}"></span>
            <span class="txt">${esc(l.descricao)}${l.fragil ? ' <span class="selovidro">🔴 VIDRO</span>' : ''}</span>
          </div>
          <div class="confcor">${l.cor ? esc(l.cor) : 'sem cor cadastrada'}</div>
          <div class="confonde">Aparece em: ${l.pedidos.map(esc).join(' · ')}${l.temJaNoFrete ? ' · <b>parte já veio no frete — procure no fundo</b>' : ''}</div>
          <div class="contador">
            <span class="rot">quantos você vê</span>
            <button type="button" onclick="mudarContagem('${l.id}', -1)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="cnt-${l.id}"
                   value="${conf.contagem[l.id] !== undefined ? conf.contagem[l.id] : ''}"
                   placeholder="?" onchange="digitouContagem('${l.id}', this.value)"
                   oninput="digitouContagem('${l.id}', this.value)">
            <button type="button" onclick="mudarContagem('${l.id}', 1)">+</button>
          </div>
        </div>`).join('')}
      <button class="ok" id="btnConferir" onclick="enviarConferencia()">Conferir a contagem</button>
      <button class="btnsec" onclick="sairDaConferencia()">◀ Voltar pra lista de pedidos</button>`;

    atualizarBotaoConferir();
    return;
  }

  /* ---------------- fase 2: o resultado ---------------- */
  const r = conf.resultado;

  if(r.ok){
    el.innerHTML = `
      <div class="confok">✓ A conta bateu${r.tentativas > 1 ? ' (na ' + r.tentativas + 'ª contagem)' : ''}<br>
        <span style="font-size:14px;font-weight:700">${r.totalLinhas} produto(s) conferido(s) — pode fechar o caminhão</span></div>
      <button class="ok" onclick="confirmarCarregamento()">Confirmar carregamento</button>
      <button class="btnsec" onclick="sairDaConferencia()">◀ Ver a lista de pedidos</button>`;
    return;
  }

  const naoContadas = r.divergencias.filter(d => d.motivo === 'nao_contado');
  const erradas = r.divergencias.filter(d => d.motivo !== 'nao_contado');

  el.innerHTML = `
    <div class="confcabeca" style="background:#b91c1c">
      <h3 style="color:#fff">A conta não bateu</h3>
      <p style="color:#ffe4e4">${r.divergencias.length} de ${r.totalLinhas} produto(s) fora. Procure antes de fechar o caminhão — é mais barato agora do que na porta do cliente.</p>
    </div>
    ${naoContadas.length ? `<div class="confaviso">⚠️ ${naoContadas.length} produto(s) você não chegou a contar. Eles entram como divergência: em branco não é zero.</div>` : ''}
    ${erradas.map(d => `
      <div class="confdiverg">
        <div class="titulo">${esc(d.descricao)}${d.cor ? ' · ' + esc(d.cor) : ''}</div>
        <div class="conta">
          Você contou <b>${d.contado}</b> · deveria ter <b>${d.esperado}</b>
          <span class="confsaldo ${d.motivo}">${plural(Math.abs(d.diferenca), d.motivo === 'falta' ? 'falta' : 'sobra')}</span>
        </div>
        <div class="onde">Procure em: ${(d.pedidos||[]).map(esc).join(' · ')}</div>
      </div>`).join('')}
    ${naoContadas.map(d => `
      <div class="confdiverg" style="border-color:#f0d495">
        <div class="titulo" style="color:#7a5416">${esc(d.descricao)}${d.cor ? ' · ' + esc(d.cor) : ''}</div>
        <div class="conta">Não contado — deveria ter <b>${d.esperado}</b></div>
        <div class="onde">Procure em: ${(d.pedidos||[]).map(esc).join(' · ')}</div>
      </div>`).join('')}

    <button class="ok" onclick="recontar()">Achei — contar de novo</button>
    <button class="btnsec" onclick="sairDaConferencia()">◀ Ver a lista de pedidos</button>

    <div class="p" style="margin-top:16px">
      <div style="font-weight:800;font-size:15px;margin-bottom:4px">Está faltando mesmo?</div>
      <div class="mut" style="font-size:13.5px">Acontece: o móvel quebrou no galpão, ou a fábrica não entregou. Escreva o que houve e feche assim mesmo — fica registrado e o gerente vê no painel.</div>
      <textarea class="confmotivo" id="motivoDiverg" placeholder="Ex.: a mesa de jantar do pedido 1042 quebrou no galpão, vai faltar mesmo"></textarea>
      <button class="btnperigo" onclick="fecharComDivergencia()">Fechar assim mesmo, com ressalva</button>
    </div>`;
}

function voltarParaRotas(){ idAtual = null; rom = null; conf = null; iniciar(true); }

async function desfazerVolumeResumo(paradaId){
  try{
    const atualizada = await api('/.netlify/functions/parada-separar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, desfazer:true }) });
    const p = rom.paradas.find(x=>x.id===paradaId);
    if(p) Object.assign(p, atualizada);
    const noArray = ordemCarregamento.find(x=>x.id===paradaId);
    if(noArray) Object.assign(noArray, atualizada);
    // Recalcula em qual parada parar, sem mexer em mostrandoVisaoGeral (senão voltava
    // pro "panorama" em vez de continuar mostrando o resumo/tela certa).
    passo = ordemCarregamento.findIndex(x => !x.separado);
    if(passo === -1) passo = ordemCarregamento.length;
    toast('Volume desfeito');
    render();
  }catch(e){ alert('Não foi possível desfazer: ' + e.message); }
}

  try{

    rom.carregamento_confirmado = false;
    toast('Carregamento reaberto');

}

async function irPara(i){
  if(i < 0) return;
  passo = i;

}

async function reportarVidroQuebrado(paradaId){
  if(!confirm('Confirma que esse vidro chegou quebrado? Isso avisa o gerente na hora.')) return;
  try{
    await api('/.netlify/functions/parada-problema', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ paradaId, problema:true, responsavel:'estoque', motivo:'Móvel quebrado', obs:'Vidro quebrado — avisado pelo estoquista na separação' }) });
    toast('Avisado! O gerente vai ver isso na aba Romaneios.');
  }catch(e){ alert('Não foi possível avisar: ' + e.message); }
}

async function confirmarVolume(paradaId){
  const botao = document.getElementById('btnvol');
  if(botao && botao.disabled) return; // trava clique duplo (não conta o mesmo volume 2x)
  if(botao) botao.disabled = true;
  const i = ordemCarregamento.findIndex(x=>x.id===paradaId);
  try{
    const atualizada = await api('/.netlify/functions/parada-separar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId }) });
    if(i>=0) Object.assign(ordemCarregamento[i], atualizada);
    if(atualizada.separado) paradaAguardandoFoto = ordemCarregamento[i>=0?i:passo];
    render();
  }catch(e){
    if(e instanceof ErroOffline){
      if(i>=0){
        const p = ordemCarregamento[i];
        // Mesma conta do servidor (situacao/filaDaParada): o teto é o tamanho da
        // fila, não o volume bruto da parada. Usar o bruto aqui deixava o contador
        // passar do que existe pra confirmar quando havia item "já no frete", e
        // marcava como separada uma parada que ainda devia volume.
        const s = situacao(p);
        const novoTotal = Math.min(s.confirmados + 1, s.confirmarTotal || 1);
        p.volumes_confirmados = novoTotal;
        p.separado = novoTotal >= s.confirmarTotal;
        enfileirar({ url: '/.netlify/functions/parada-separar', body: { paradaId }, token: localStorage.getItem('equipeToken') });
        localStorage.setItem('romCacheSep_'+idAtual, JSON.stringify(rom));
        toast('Sem internet — confirmado no celular, será enviado quando voltar o sinal');
        if(p.separado) paradaAguardandoFoto = p;
      }
      render();
    } else {
      alert('Falha ao salvar: ' + e.message);
      if(botao) botao.disabled = false;
    }
  }
}

function escolherTipoFoto(paradaId, tipo){

  input.onchange = () => enviarFoto(paradaId, input.files[0], tipo);
  input.click();
}

async function avancarPassoDepoisDaFoto(){
  paradaAguardandoFoto = null;
  passo++;
  await avancarSeSemVolume();
  render();
}
function pularFoto(){ avancarPassoDepoisDaFoto(); }
function redimensionarImagem(file, maxLado){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxLado){ height = Math.round(height * maxLado/width); width = maxLado; }
      else if(height > maxLado){ width = Math.round(width * maxLado/height); height = maxLado; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function enviarFoto(paradaId, file, tipo){
  if(!file) return avancarPassoDepoisDaFoto();
  try{
    const imagemBase64 = await redimensionarImagem(file, 1280);
    await api('/.netlify/functions/foto-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, imagemBase64, tipo }) });
  }catch(e){ if(!(e instanceof ErroOffline)) alert('Falha ao enviar a foto: ' + e.message); else toast('Sem internet — foto não enviada, siga em frente'); }
  await avancarPassoDepoisDaFoto();
}
