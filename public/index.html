<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Outlet dos Móveis DB</title>
<link rel="icon" href="/logo.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#14140F;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#14140F;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:360px;width:100%}
.marca{text-align:center;margin-bottom:20px}
.marca img{width:110px;height:110px;border-radius:16px;display:inline-block}
.painel{background:#fff;border-radius:18px;padding:24px 20px}
h1{font-size:19px;text-align:center;margin:0 0 20px}
.papel{display:block;width:100%;padding:20px;border:2px solid #14140F;border-radius:14px;background:#fff;margin-bottom:12px;cursor:pointer;text-align:center;font-size:19px;font-weight:800;color:#14140F;font-family:inherit}
.papel .emoji{font-size:42px;display:block;margin-bottom:6px}
.papel:active{background:#F2F250}
/* "Continuar como fulano": quem já entrou uma vez sai daqui num toque só. */
.papel.volta{background:#F2F250;border-color:#14140F}
.papel.volta .emoji{font-size:34px}
.papel.volta small{display:block;font-size:12.5px;font-weight:600;color:#5c5c33;margin-top:3px}
.outra{background:none;border:0;color:#6f6f66;font-size:13.5px;cursor:pointer;padding:8px 0 0;font-family:inherit;width:100%}
input{width:100%;padding:15px;border:2px solid #d8d8cd;border-radius:11px;font:inherit;margin-bottom:12px;font-size:17px;color:#14140F}
input:focus{outline:none;border-color:#14140F}
button.entrar{width:100%;padding:16px;border:0;border-radius:11px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:#F2F250;color:#14140F}
button.entrar:disabled{opacity:.6}
.voltar{background:none;border:0;color:#6f6f66;font-size:14px;margin-bottom:14px;cursor:pointer;padding:0;font-family:inherit}
.err{background:#fdeaea;color:#7f1d1d;padding:11px 12px;border-radius:9px;font-size:14px;margin-bottom:12px;font-weight:600}
</style>
</head>
<body>

<div class="box">
  <div class="marca"><img src="/logo.svg" alt="Outlet dos Móveis DB"></div>
  <div class="painel">
    <div id="tela1">
      <h1>Você é...</h1>
      <div id="continuar"></div>
      <button class="papel" data-papel="admin"><span class="emoji">🗝️</span>Gerente</button>
      <button class="papel" data-papel="freteiro"><span class="emoji">🚚</span>Freteiro</button>
      <button class="papel" data-papel="estoquista"><span class="emoji">📦</span>Estoquista</button>
    </div>

    <div id="tela2" hidden>
      <button class="voltar" id="btnVoltar">◀ Voltar</button>
      <h1 id="tituloPapel"></h1>
      <div id="erro"></div>
      <input id="telefone" type="tel" placeholder="Seu telefone" autocomplete="tel">
      <button class="entrar" id="btnEntrar">Entrar</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Onde cada papel trabalha. O gerente cai no painel, que tem o login
// próprio dele (e-mail e senha do Supabase Auth).
const DESTINO = { admin:'/painel', freteiro:'/entrega', estoquista:'/separacao' };
const ROTULO  = { admin:'🗝️ Gerente', freteiro:'🚚 Freteiro', estoquista:'📦 Estoquista' };

let papel = null;

function escolher(p){
  // Gerente não tem login por telefone: o painel pede e-mail e senha.
  if(p === 'admin'){ location.href = DESTINO.admin; return; }
  papel = p;
  $('#tela1').hidden = true;
  $('#tela2').hidden = false;
  $('#tituloPapel').textContent = ROTULO[p];
  $('#telefone').value = '';
  $('#erro').innerHTML = '';
  $('#telefone').focus();
}
document.querySelectorAll('.papel[data-papel]').forEach(b => {
  b.onclick = () => escolher(b.dataset.papel);
});
$('#btnVoltar').onclick = () => { $('#tela1').hidden = false; $('#tela2').hidden = true; };

async function entrar(){
  const btn = $('#btnEntrar');
  const telefone = $('#telefone').value.trim();
  $('#erro').innerHTML = '';
  if(!telefone){ $('#erro').innerHTML = '<div class="err">Digite o telefone</div>'; return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  try{
    const r = await fetch('/api/equipe-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ telefone, tipo: papel })
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.erro || 'não foi possível entrar');
    localStorage.setItem('equipeToken', j.token);
    localStorage.setItem('equipeTipo', papel);
    localStorage.setItem('equipeNome', j.nome || '');
    location.href = DESTINO[papel];
  }catch(e){
    $('#erro').innerHTML = '<div class="err">'+esc(e.message)+'</div>';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
$('#btnEntrar').onclick = entrar;
// Teclado do celular: o "ir/enter" também entra, sem precisar achar o botão.
$('#telefone').addEventListener('keydown', e => { if(e.key === 'Enter') entrar(); });

/* Quem já entrou antes ganha um atalho, mas NÃO é redirecionado à força.
   A versão antiga pulava direto e um celular que logou com o telefone
   errado ficava preso nessa tela para sempre. Aqui é sempre um toque. */
(function atalho(){
  const tipo = localStorage.getItem('equipeTipo');
  const token = localStorage.getItem('equipeToken');
  const nome = localStorage.getItem('equipeNome');
  // Sessão do Supabase Auth (gerente) mora numa chave sb-<projeto>-auth-token.
  const temAdmin = Object.keys(localStorage).some(k => /^sb-.*-auth-token$/.test(k));

  let quem = null;
  if(token && DESTINO[tipo]) quem = { papel: tipo, nome: nome || '' };
  else if(temAdmin) quem = { papel: 'admin', nome: '' };
  if(!quem) return;

  const emoji = quem.papel === 'freteiro' ? '🚚' : quem.papel === 'estoquista' ? '📦' : '🗝️';
  const titulo = quem.nome ? esc(quem.nome) : ROTULO[quem.papel].replace(/^\S+\s/, '');
  $('#continuar').innerHTML =
    '<button class="papel volta" id="btnContinuar"><span class="emoji">' + emoji + '</span>' +
    'Continuar<small>como ' + titulo + '</small></button>' +
    '<button class="outra" id="btnOutra">Sou outra pessoa</button>';
  $('#btnContinuar').onclick = () => { location.href = DESTINO[quem.papel]; };
  $('#btnOutra').onclick = () => {
    localStorage.removeItem('equipeToken');
    localStorage.removeItem('equipeTipo');
    localStorage.removeItem('equipeNome');
    $('#continuar').innerHTML = '';
  };
})();
</script>
</body>
</html>
