<script>

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/**
 * APAGA TUDO QUE ESTA PESSOA DEIXOU NO CELULAR.
 *
 * Sair apagava só o token. Ficavam pra trás:
 *
 *   · o cache da rota — nome, telefone e endereço dos clientes. Num celular
 *     dividido entre dois freteiros, o segundo abria e via a rota do primeiro
 *     enquanto o servidor não respondia.
 *   · a fila de ações pendentes, com o token do PRIMEIRO gravado dentro. Elas
 *     disparavam depois, em nome de quem já tinha saído.
 *
 * Varre por prefixo em vez de apagar uma lista de chaves conhecidas: uma chave
 * nova aparece a cada funcionalidade, e a lista escrita à mão sempre ficaria
 * uma atrás.
 */
function limparSessaoLocal(){
  const PREFIXOS = ['romCache_', 'romCacheSep_'];
  const CHAVES = ['equipeToken', 'equipeTipo', 'equipeNome',
                  'filaOffline', 'filaOfflineSep', 'ultimaContagemParadas'];
  try{
    for(const k of CHAVES) localStorage.removeItem(k);
    // Copia as chaves antes de apagar: mexer no localStorage enquanto se percorre
    // ele pula item.
    for(const k of Object.keys(localStorage)){
      if(PREFIXOS.some(p => k.startsWith(p))) localStorage.removeItem(k);
    }
  }catch(e){ /* modo privado: não dá pra apagar o que não dá pra guardar */ }
}
let rom = null, idAtual = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }

function corParaSwatch(nome){
  const n = (nome||'').trim().toLowerCase();
  if(n==='branco') return '#ffffff';
  if(n==='off') return '#efe6d3';
  if(n==='nature') return '#a3744f';
  if(n==='nature/off') return 'linear-gradient(135deg,#a3744f 60%,#efe6d3 60%)';
  if(n==='off/nature') return 'linear-gradient(135deg,#a3744f 40%,#efe6d3 40%)';
  return n ? '#cbd5e1' : 'transparent';
}

class ErroOffline extends Error {}
async function api(url, opt){
  const token = localStorage.getItem('equipeToken');
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, token ? { Authorization: 'Bearer ' + token } : {});
  let r;
  try{ r = await fetch(url, opt); }
  catch(e){ throw new ErroOffline('sem conexão'); }
  // Sessão morreu (login removido do cadastro, por ex.): volta pro início em vez de
  // deixar a pessoa presa numa tela de erro que ela não sabe resolver.
  if(r.status === 401){
    limparSessaoLocal();
    location.href = '/';
    throw new Error('sessão expirada');
  }
  const j = await r.json().catch(()=>({erro:'resposta inválida'}));
  if(!r.ok) throw new Error(j.erro || ('HTTP '+r.status));
  return j;
}

/* ---------------- fila offline: ações que não puderam ser enviadas ---------------- */
function filaOffline(){ try{ return JSON.parse(localStorage.getItem('filaOffline')||'[]'); }catch(e){ return []; } }
function salvarFila(f){ localStorage.setItem('filaOffline', JSON.stringify(f)); atualizarAvisoOffline(); }
function enfileirar(acao){ const f = filaOffline(); f.push(acao); salvarFila(f); }
function atualizarAvisoOffline(){
  const n = filaOffline().length;
  const el = document.getElementById('avisoOffline');
  el.hidden = n === 0;
  if(n) el.textContent = `📶 Sem internet — ${n} ação(ões) salva(s) no celular, serão enviadas quando o sinal voltar`;
}
/**
 * MANDA AS AÇÕES QUE FICARAM PRESAS SEM SINAL.
 *
 * O QUE ESTAVA ERRADO: o código antigo era
 *
 *     try{ await fetch(...) } catch(e){ restam.push(acao); }
 *
 * e isso guarda a ação SÓ quando não há rede. O fetch não estoura quando o
 * servidor responde 401 ou 400 — ele resolve normalmente. Então uma entrega
 * recusada pelo servidor era descartada como se tivesse dado certo.
 *
 * Na prática: o freteiro marcava "entreguei" sem sinal, o sinal voltava, o
 * servidor recusava (sessão expirada, por exemplo) — e a entrega SUMIA. Ele
 * achava que tinha registrado. Ninguém ficava sabendo.
 *
 * Agora o destino depende da resposta:
 *
 *   deu certo (2xx)       -> some da fila, é isso mesmo
 *   sem rede              -> fica, tenta no próximo sinal
 *   servidor fora (5xx)   -> fica, é passageiro
 *   401/403               -> fica, mas a pessoa é avisada: precisa entrar de novo
 *   400 e afins (4xx)     -> some, MAS avisa. O servidor recusou o conteúdo;
 *                            tentar de novo daria o mesmo erro pra sempre.
 */
async function processarFila(){
  const f = filaOffline();
  if(!f.length) return;

  const restam = [];
  let enviadas = 0, recusadas = 0, precisaEntrarDeNovo = false;

  for(const acao of f){
    let r;
    try{
      r = await fetch(acao.url, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + acao.token },
        body: JSON.stringify(acao.body)
      });
    }catch(e){
      restam.push(acao);       // sem rede: continua devendo
      continue;
    }

    if(r.status >= 200 && r.status < 300){ enviadas++; continue; }

    if(r.status === 401 || r.status === 403){
      // A sessão morreu enquanto isso esperava. NÃO joga fora: a entrega
      // aconteceu de verdade, e some se ninguém guardar.
      restam.push(acao);
      precisaEntrarDeNovo = true;
      continue;
    }

    if(r.status >= 500){ restam.push(acao); continue; }

    // 4xx: o servidor recusou o conteúdo. Repetir daria o mesmo erro pra sempre,
    // então sai da fila — mas ninguém perde uma entrega em silêncio.
    recusadas++;
  }

  salvarFila(restam);
  atualizarAvisoOffline();

  if(enviadas) toast(enviadas + ' ação(ões) pendente(s) enviada(s)!');
  if(recusadas){
    alert(recusadas + ' ação(ões) foram recusadas pelo servidor e não puderam ser salvas. '
      + 'Confira se a entrega está marcada certo na tela e refaça se precisar.');
  }
  if(precisaEntrarDeNovo){
    alert('Sua sessão expirou e ainda há entrega esperando pra ser enviada. '
      + 'Entre de novo com seu telefone — nada foi perdido, vai sozinho assim que você entrar.');
  }
  if(enviadas && idAtual) carregar();
}
window.addEventListener('online', processarFila);

function base64UrlParaBytes(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(b64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function atualizarBotaoNotif(){

  }catch(e){ /* segue sem notificação, não trava o app */ }
}

document.getElementById('btnNotif').onclick = async () => {
  const aviso = document.getElementById('avisoNotif');
  if(noIOSNaoInstalado()){
    aviso.hidden = false;
    aviso.textContent = '📱 No iPhone: toque em Compartilhar → "Adicionar à Tela de Início", abra o app por esse ícone, e toque no 🔔 de novo.';
    return;
  }
  try{
    const reg = await navigator.serviceWorker.register('/sw.js');
    const jaTem = await reg.pushManager.getSubscription();
    if(jaTem){
      await jaTem.unsubscribe();
      await api('/api/push-subscrever', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subscription: jaTem, remover: true }) }).catch(()=>{});
      toast('Notificações desativadas');
    } else {
      const permissao = await Notification.requestPermission();
      if(permissao !== 'granted'){ toast('Sem permissão pra notificar — ative nas configurações do navegador'); return; }
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: base64UrlParaBytes(VAPID_PUBLIC_KEY) });
      await api('/api/push-subscrever', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subscription: sub }) });
      toast('Notificações ativadas!');
    }
  }catch(e){ toast('Não deu pra mexer nas notificações: ' + e.message); }
  atualizarBotaoNotif();
};

// Bolinha vermelha no sino: acende quando o total de paradas das suas rotas cresceu
// desde a última vez que você abriu o app — ou seja, chegou pedido novo. Como só cresce
// com pedido novo (entregar não diminui o total, só o "entregues"), não confunde
// "ainda tenho entrega pra fazer" com "chegou algo novo".
function atualizarBadgeNotif(totalAgora){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const anterior = Number(localStorage.getItem('ultimaContagemParadas') || 0);
  badge.hidden = !(totalAgora > anterior);
  localStorage.setItem('ultimaContagemParadas', String(totalAgora));
}

// Mostra as rotas de HOJE EM DIANTE — não some se você já criou a rota de amanhã.
// Guardada pra saber se vale mostrar o botão de voltar: com uma rota só ele seria
// um caminho pra lugar nenhum.
let rotasDisponiveis = [];

function voltarParaRotas(){
  idAtual = null;
  rom = null;
  iniciar();
}

async function iniciar(){
  try{
    const rotas = await api('/api/minhas-rotas');
    rotasDisponiveis = rotas;
    atualizarBadgeNotif(rotas.reduce((s,r)=>s+(r.totalParadas||0), 0));
    document.getElementById('rotaCompleta').innerHTML = '';
    document.getElementById('addbox').innerHTML = '';
    document.getElementById('bar').style.width = '0%';
    const btnNovaRota = '<button class="amarelo" onclick="abrirNovaRota()">➕ Começar uma rota agora</button>'
      + '<button class="btnsec" onclick="verHistorico()">📜 Ver rotas que já passaram</button>';
    if(!rotas.length){
      document.getElementById('titulo').textContent = 'Sem rota';
      document.getElementById('sub').textContent = '';
      document.getElementById('lista').innerHTML = '<div class="empty">Nenhuma rota agendada pra você ainda.</div>' + btnNovaRota;
      return;
    }
    if(rotas.length === 1){ idAtual = rotas[0].id; await carregar(); return; }
    document.getElementById('titulo').textContent = 'Suas rotas';
    document.getElementById('sub').textContent = 'Você tem mais de uma rota agendada — escolha uma:';
    document.getElementById('lista').innerHTML = rotas.map(r => `
      <a class="rota" href="#" onclick="abrirRota('${r.id}');return false;">
        <span class="n">${esc(r.codigo)}</span>
        <div class="end">${esc(r.data||'')} · ${r.entregues}/${r.totalParadas} entregues</div>
      </a>`).join('') + btnNovaRota;
  }catch(e){
    document.getElementById('titulo').textContent = 'Sem internet';
    document.getElementById('lista').innerHTML = '<div class="empty">Não deu pra carregar a rota de hoje. Assim que voltar o sinal, tente de novo.</div>';
  }
}
function abrirRota(id){ idAtual = id; carregar(); }

/* ---------------- mexer na rota que já existe ----------------
   O freteiro montava rota nova e podia tirar pedido ANTES de gerar. Depois de
   gerada, não tinha como acrescentar nem remover — e é aí que a vida acontece:
   o cliente desmarca, o móvel não ficou pronto, entra um pedido de última hora.
   Sem isso, virava ligação no meio da rua pra alguém mexer no painel. */

let pedidoParaAdicionar = null;

function abrirAdicionarNaRota(){
  pedidoParaAdicionar = null;
  document.getElementById('addbox').innerHTML = `
    <div class="p">
      <h3 style="margin:0 0 8px">Acrescentar pedido nesta rota</h3>
      <div class="buscapedido">
        <input id="numAddRota" inputmode="numeric" placeholder="Número do pedido">
        <button class="ok" onclick="buscarPedidoParaAdicionar()">Buscar</button>
      </div>
      <div id="resAddRota"></div>
      <button class="btnsec" onclick="fecharAdicionarNaRota()">Cancelar</button>
    </div>`;
  document.getElementById('addbox').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function fecharAdicionarNaRota(){
  pedidoParaAdicionar = null;
  document.getElementById('addbox').innerHTML = '';
}

async function buscarPedidoParaAdicionar(){
  const numero = document.getElementById('numAddRota').value.trim();
  const caixa = document.getElementById('resAddRota');
  if(!numero){ caixa.innerHTML = '<div class="err">Digite o número do pedido.</div>'; return; }
  caixa.innerHTML = '<div class="mut">Buscando...</div>';
  try{
    const p = await api('/api/pedido?numero=' + encodeURIComponent(numero));
    pedidoParaAdicionar = p;
    const c = p.cliente || {};
    const itens = (p.itens||[]).map(it =>
      `<div>${esc(it.quantidade)}x ${esc(it.descricao)}${it.cor?' — '+esc(it.cor):''}</div>`).join('');
    caixa.innerHTML = `
      <div class="pedidoencontrado">
        <div style="font-weight:800;font-size:17px">Pedido ${esc(p.numero)}</div>
        <div style="font-weight:700;margin-top:6px">${esc(c.nome||'(sem cliente)')}</div>
        <div class="mut">${esc(Endereco.enderecoEmLinha(c))}</div>
        ${itens?`<div class="itens">${itens}</div>`:''}
        <button class="ok" style="margin-top:10px" onclick="confirmarAdicionarNaRota()">✓ Acrescentar nesta rota</button>
      </div>`;
  }catch(e){
    caixa.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

async function confirmarAdicionarNaRota(){
  if(!pedidoParaAdicionar || !idAtual) return;
  try{
    await api('/api/romaneios?id=' + encodeURIComponent(idAtual), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ paradas: [pedidoParaAdicionar] })
    });
    fecharAdicionarNaRota();
    toast('Pedido acrescentado na rota');
    await carregar();
  }catch(e){ alert('Não deu pra acrescentar: ' + e.message); }
}

/**
 * Tira um pedido da rota.
 *
 * Só some o que ainda não foi finalizado — parada entregue ou dada como não
 * entregue é o registro do que aconteceu, com foto e assinatura junto. O
 * servidor recusa de novo; aqui o botão nem aparece, pra não oferecer o que vai
 * dar erro.
 *
 * Dois toques pra confirmar, no próprio botão. Alert de confirmação no celular
 * some atrás do teclado e é fácil de aceitar sem ler.
 */
async function removerParada(i, botao){
  const p = rom.paradas[i];
  if(!p) return;
  if(botao.dataset.confirmando !== '1'){
    botao.dataset.confirmando = '1';
    botao.textContent = 'Tem certeza? Toque de novo';
    setTimeout(() => {
      if(botao.dataset.confirmando === '1'){
        botao.dataset.confirmando = '0';
        botao.textContent = '🗑️ Tirar da rota';
      }
    }, 4000);
    return;
  }
  botao.disabled = true;
  try{
    await api('/api/parada-status?id=' + encodeURIComponent(p.id), { method:'DELETE' });
    toast('Pedido tirado da rota');
    await carregar();
  }catch(e){
    botao.disabled = false;
    botao.dataset.confirmando = '0';
    botao.textContent = '🗑️ Tirar da rota';
    alert('Não deu pra tirar: ' + e.message);
  }
}

/* ---------------- histórico de rotas ----------------
   Vem de uma consulta separada (?historico=1), não junto com as rotas do dia: o
   freteiro abre este app na rua, e a tela de hoje não pode ficar pesada por causa
   de algo que ele olha uma vez por semana. */
async function verHistorico(){
  document.getElementById('titulo').textContent = 'Rotas que já passaram';
  document.getElementById('sub').textContent = '';
  // Os botoes da rota aberta (Maps, Acrescentar) e o formulario de acrescentar
  // pertencem AQUELA rota. Deixados na tela, ficavam flutuando em cima de uma
  // lista de rotas antigas, oferecendo acao numa rota que nao esta mais aberta.
  document.getElementById('rotaCompleta').innerHTML = '';
  document.getElementById('addbox').innerHTML = '';
  document.getElementById('bar').style.width = '0%';
  document.getElementById('lista').innerHTML = '<div class="empty">Buscando...</div>';
  try{
    const rotas = await api('/api/minhas-rotas?historico=1');
    if(!rotas.length){
      document.getElementById('lista').innerHTML =
        '<div class="empty">Você ainda não tem rota encerrada.</div>'
        + '<button class="btnsec" onclick="iniciar()">◀ Voltar</button>';
      return;
    }
    document.getElementById('lista').innerHTML = rotas.map(r => {
      const pendentes = (r.totalParadas||0) - (r.entregues||0) - (r.falharam||0);
      return `<a class="rota" href="#" onclick="abrirRota('${r.id}');return false;">
        <span class="n">${esc(r.codigo)}</span>
        <div class="end">${esc(dataCurtaBR(r.data))} · ${r.entregues}/${r.totalParadas} entregues${r.falharam?' · '+r.falharam+' não entregue(s)':''}${pendentes>0?' · '+pendentes+' sem fechar':''}</div>
      </a>`;
    }).join('') + '<button class="btnsec" onclick="iniciar()">◀ Voltar</button>';
  }catch(e){
    document.getElementById('lista').innerHTML =
      `<div class="empty">Não deu pra buscar o histórico: ${esc(e.message)}</div>`
      + '<button class="btnsec" onclick="iniciar()">◀ Voltar</button>';
  }
}

/** "2026-09-14" -> "14/09". Sem passar por Date: data pura vira o dia anterior no nosso fuso. */
function dataCurtaBR(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||''));
  return m ? `${m[3]}/${m[2]}` : (d || '');
}

/* ---------------- começar uma rota nova (freteiro monta a dele mesmo) ---------------- */
let rascunhoNovaRota = [], pedidoBuscadoRota = null;
const dataBRHoje = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Fortaleza'}).format(new Date());

function abrirNovaRota(){
  rascunhoNovaRota = []; pedidoBuscadoRota = null;
  document.getElementById('titulo').textContent = 'Nova rota';
  document.getElementById('sub').textContent = '';
  renderNovaRota();
}
function fecharNovaRota(){ rascunhoNovaRota = []; pedidoBuscadoRota = null; iniciar(); }

function renderNovaRota(){
  const listaAdicionados = rascunhoNovaRota.map((d,i)=>{
    const c = d.cliente||{};
    return `<div class="pedidoadicionado">
      <span class="desc"><b>Pedido ${esc(d.numero)}</b> — ${esc(c.nome||'sem cliente')}</span>
      <button class="removeritem" onclick="removerDaNovaRota(${i})">Remover</button>
    </div>`;
  }).join('');
  document.getElementById('lista').innerHTML = `
    <div class="p">
      <h3 style="font-size:19px">Buscar pedido</h3>
      <div class="buscapedido">
        <input type="tel" inputmode="numeric" id="numPedidoRota" placeholder="Número do pedido">
        <button type="button" onclick="buscarPedidoRota()">Buscar</button>
      </div>
      <div id="resultadoPedidoRota"></div>
      ${rascunhoNovaRota.length ? `
        <h3 style="font-size:15px;margin-top:16px">Pedidos nessa rota (${rascunhoNovaRota.length})</h3>
        ${listaAdicionados}
        <div style="margin-top:12px"><label style="font-size:12px;color:#57574e;font-weight:600">Data da rota</label>
        <input type="date" id="dataNovaRota" value="${dataBRHoje()}" style="width:100%;padding:12px;border:2px solid #e2e2d9;border-radius:10px;font:inherit;margin-top:4px"></div>
        <button class="ok" style="margin-top:12px" onclick="criarNovaRota()">Criar rota com ${rascunhoNovaRota.length} pedido(s)</button>
      ` : ''}
      <button type="button" class="cancelarrota" onclick="fecharNovaRota()">Cancelar</button>
    </div>`;
}

async function buscarPedidoRota(){
  const numero = document.getElementById('numPedidoRota').value.trim();
  if(!numero) return toast('Digite o número do pedido');
  const caixa = document.getElementById('resultadoPedidoRota');
  caixa.innerHTML = '<p class="mut" style="margin-top:10px">Buscando…</p>';
  try{
    const p = await api('/api/pedido?numero='+encodeURIComponent(numero));
    pedidoBuscadoRota = p;
    const c = p.cliente || {};
    const itensHtml = (p.itens||[]).map((it,i)=>`<div class="itemrota">
      <span class="desc">${esc(it.quantidade)}x ${esc(it.descricao)}</span>
      <input placeholder="cor" id="corItemRota-${i}">
    </div>`).join('') || '<p class="mut">Sem itens.</p>';
    caixa.innerHTML = `
      <div class="pedidoencontrado">
        <div style="font-weight:800;font-size:17px">Pedido ${esc(p.numero)}</div>
        <div style="font-weight:700;margin-top:6px">${esc(c.nome||'(sem cliente)')}</div>
        <div class="mut">${esc(Endereco.enderecoEmLinha(c))}</div>
        ${itensHtml}
        <button class="ok" style="margin-top:10px" onclick="adicionarNaNovaRota()">✓ Adicionar essa rota</button>
      </div>`;
  }catch(e){ caixa.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message)}</div>`; }
}

function adicionarNaNovaRota(){
  const p = pedidoBuscadoRota;
  if(!p) return;
  const itens = (p.itens||[]).map((it,i)=>({
    ...it,
    cor: (document.getElementById('corItemRota-'+i)||{}).value || ''
  }));
  rascunhoNovaRota.push({ ...p, itens });
  pedidoBuscadoRota = null;
  document.getElementById('numPedidoRota').value = '';
  toast('Pedido adicionado!');
  renderNovaRota();
}
function removerDaNovaRota(i){ rascunhoNovaRota.splice(i,1); renderNovaRota(); }

async function criarNovaRota(){
  if(!rascunhoNovaRota.length) return;
  const dataRota = document.getElementById('dataNovaRota').value;
  try{
    await api('/api/romaneios', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ dataRota, paradas: rascunhoNovaRota }) });
    toast('Rota criada!');
    // Já marca essas paradas como "vistas" antes de recarregar — foi ele mesmo que
    // criou, não faz sentido o sino acender um alerta de "chegou pedido novo" pra ele.
    const baseline = Number(localStorage.getItem('ultimaContagemParadas') || 0);
    localStorage.setItem('ultimaContagemParadas', String(baseline + rascunhoNovaRota.length));
    rascunhoNovaRota = []; pedidoBuscadoRota = null;
    await iniciar();
  }catch(e){ alert('Não foi possível criar a rota: ' + e.message); }
}

async function carregar(){
  try{
    rom = await api('/api/romaneio-publico?id='+idAtual);
    localStorage.setItem('romCache_'+idAtual, JSON.stringify(rom));
    render();
  }catch(e){
    const cache = localStorage.getItem('romCache_'+idAtual);
    if(cache){ rom = JSON.parse(cache); render(); toast('Sem internet — mostrando a última rota salva no celular'); }
    else{ document.getElementById('titulo').textContent = 'Erro'; document.getElementById('lista').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  }
}

function linkRotaCompleta(){
  const enderecos = rom.paradas.map(p => Endereco.enderecoParaMapa(p.cliente)).filter(Boolean);
  if(!enderecos.length) return '';
  const destino = enderecos[enderecos.length-1];
  const waypoints = enderecos.slice(0, -1).map(encodeURIComponent).join('|');
  const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(ESTOQUE.endereco)}&destination=${encodeURIComponent(destino)}`;
  return waypoints ? url + `&waypoints=${waypoints}` : url;
}

function render(){
  const ok = rom.paradas.filter(p=>p.status==='entregue'||p.status==='falhou').length;
  document.getElementById('titulo').textContent = 'Romaneio ' + rom.codigo;
  document.getElementById('sub').textContent =
    (rom.freteiro ? rom.freteiro.nome + ' · ' : '') + rom.data + ' · ' + ok + '/' + rom.paradas.length + ' concluídas';
  document.getElementById('bar').style.width = (rom.paradas.length ? ok/rom.paradas.length*100 : 0) + '%';

  const rotaLink = linkRotaCompleta();
  // Quem tem mais de uma rota no dia entrava numa e ficava preso: a lista só aparecia
  // ao abrir o app, e não havia caminho de volta. Terminar a primeira rota e começar a
  // segunda exigia fechar e reabrir o app, o que ninguém adivinha.
  const voltar = rotasDisponiveis.length > 1
    ? '<button class="btnvoltarrotas" onclick="voltarParaRotas()">Minhas rotas de hoje</button>'
    : '';
  document.getElementById('rotaCompleta').innerHTML = voltar + (rotaLink
    ? `<a class="maprota" target="_blank" href="${rotaLink}">Abrir rotas no Maps</a>`
    : '')
    + '<div class="acoesrota"><button onclick="abrirAdicionarNaRota()">➕ Acrescentar pedido</button></div>';

  document.getElementById('lista').innerHTML = rom.paradas.map((p,i)=>{
    const c = p.cliente || {};
    // A ordem vem do endereco.js, que as três páginas dividem. O mapa continua
    // recebendo a ordem dos Correios: ele não lê ordem de motorista.
    const partes = Endereco.partesDoEndereco(c);
    const q = encodeURIComponent(Endereco.enderecoParaMapa(c));
    const telLimpo = (c.telefone||'').replace(/\D/g,'');
    const itens = (p.itens||[]).map(it=>`<div>${it.cor?`<span class="sw" style="background:${corParaSwatch(it.cor)}"></span>`:''}${esc(it.quantidade)}x ${esc(it.descricao)}${it.cor?` — <b>${esc(it.cor)}</b>`:''}${it.fragil?' <b style="color:#b91c1c">🔴 VIDRO</b>':''}</div>`).join('');
    const comVidro = (p.itens||[]).filter(it=>it.fragil);
    const fotoVidroFeita = (p.fotos||[]).some(f=>f.tipo==='vidro');
    const assinaturaFeita = (p.fotos||[]).some(f=>f.tipo==='assinatura');
    const faltaVidro = comVidro.length > 0 && (!fotoVidroFeita || !assinaturaFeita);
    const feito = p.status === 'entregue' || p.status === 'falhou';
    const rotulo = p.tipo==='assistencia' ? 'Assistência' : (p.tipo==='nf' ? 'NF' : 'Pedido');
    const fotos = (p.fotos||[]).map(f=>`<a href="${f.url}" target="_blank" class="fotoitem"><img src="${f.url}"><span class="fotolabel">${rotuloFoto(f.tipo)}</span></a>`).join('');
    const fotoPagamentoFeita = (p.fotos||[]).some(f=>f.tipo==='pagamento');
    const fotoProdutoFeita = (p.fotos||[]).some(f=>f.tipo==='produto');
    return `<div class="p ${feito?'done':''}">
      <span class="n dest">${i+1} de ${rom.paradas.length}</span>
      <span class="n">${rotulo}${p.numero?' '+esc(p.numero):''}</span>
      ${p.status==='em_rota'?'<span class="n">Em rota</span>':''}
      <h3>${esc(c.nome||'(sem cliente)')}</h3>
      <div class="end">${partes.length
        ? partes.map(x => x.destaque ? `<b class="regiao">${esc(x.valor)}</b>` : esc(x.valor)).join(' · ')
        : 'endereço não informado'}${c.cep?' · '+esc(c.cep):''}</div>
      ${comVidro.length?`<div class="avisovidro">🔴 VAI COM VIDRO — cuidado no transporte e na descida<div class="quais">${comVidro.map(it=>esc(it.descricao)).join(' · ')}</div></div>`:''}
      ${itens?`<div class="itens">${itens}</div>`:''}
      ${p.observacao?`<div class="obsfreteiro">📌 Recado do gerente: ${esc(p.observacao)}</div>`:''}
      <div class="contatos">
        ${q?`<a class="botaogrande bmapa" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${q}"><span class="emoji">📍</span>Mapa</a>`:''}
        ${telLimpo?`<a class="botaogrande btel" href="tel:${telLimpo}"><span class="emoji">📞</span>Ligar</a>`:''}
        ${telLimpo?`<a class="botaogrande bwpp" target="_blank" href="https://wa.me/55${telLimpo}"><span class="emoji">💬</span>WhatsApp</a>`:''}
      </div>
      <div class="contatos">
        <button type="button" class="botaogrande bouvir" onclick="ouvirEndereco(${i})"><span class="emoji">🔊</span>Ouvir endereço</button>
        ${telLimpo?`<button type="button" class="botaogrande bouvir" onclick="ouvirTelefone(${i})"><span class="emoji">🔊</span>Ouvir telefone</button>`:''}
      </div>
      <div class="fotos">${fotos}</div>
      <div class="tituloFotos">Duas fotos pra guardar dessa entrega:</div>
      <button class="btnfoto ${fotoProdutoFeita?'feito':''}" onclick="document.getElementById('foto-${p.id}').click()">${fotoProdutoFeita?'✓ Foto do produto guardada':'📷 Foto do produto na casa do cliente'}</button>
      <input type="file" id="foto-${p.id}" accept="image/*" capture="environment" style="display:none" onchange="enviarFoto('${p.id}', this.files[0])">
      <button class="btnpagamento ${fotoPagamentoFeita?'feito':''}" onclick="document.getElementById('fotopagamento-${p.id}').click()">${fotoPagamentoFeita?'✓ Comprovante de pagamento guardado':'💰 Comprovante de pagamento (se houver)'}</button>
      <input type="file" id="fotopagamento-${p.id}" accept="image/*" capture="environment" style="display:none" onchange="enviarFotoPagamento('${p.id}', this.files[0])">
      ${(!feito && comVidro.length) ? `
      <div class="vidrocheck">
        <div class="vidrocheck-titulo">📋 Antes de entregar (tem vidro):</div>
        <button type="button" class="passovidro ${fotoVidroFeita?'feito':''}" onclick="document.getElementById('fotovidro-${p.id}').click()" ${fotoVidroFeita?'disabled':''}>
          ${fotoVidroFeita ? '✓ Foto do vidro guardada' : '📷 Tirar foto do vidro'}
        </button>
        <input type="file" id="fotovidro-${p.id}" accept="image/*" capture="environment" style="display:none" onchange="enviarFotoVidro('${p.id}', this.files[0])">
        <button type="button" class="passovidro ${assinaturaFeita?'feito':''}" onclick="abrirAssinatura(${i})" ${assinaturaFeita?'disabled':''}>
          ${assinaturaFeita ? '✓ Assinatura do cliente colhida' : '✍️ Colher assinatura do cliente'}
        </button>
        <div id="assinaturabox-${i}"></div>
      </div>` : ''}
      ${p.status==='reagendada' ? `<div class="reagendada">🕐 Fica pra ${esc(rotuloJanela(p.janela)).toLowerCase()}${p.motivo?' — '+esc(p.motivo):''}<br><small>Continua devendo. A rota não fecha enquanto não resolver.</small></div>` : ''}
      ${feito
        ? `<div class="status ${p.status==='entregue'?'ok':'no'}">${p.status==='entregue'?'✓ Entregue':'✕ Não entregue'}${p.recebedor?' — '+esc(p.recebedor):''}${p.motivo?' — '+esc(p.motivo):''}<br><small>${p.entregue_em?new Date(p.entregue_em).toLocaleString('pt-BR'):''}</small></div>
           <button class="btndesfazer" onclick="desfazer(${i})">↩️ Desfazer</button>`
        : `<div class="acoes">
             <button class="ok" id="btnok-${i}" onclick="marcar(${i},'entregue')" ${faltaVidro?'disabled title="Tire a foto do vidro e colha a assinatura antes"':''}>✓ Entreguei</button>
             <button class="no" id="btnno-${i}" onclick="abrirMotivos(${i})">✕ Não entreguei</button>
           </div>
           <button class="btndepois" id="btndepois-${i}" onclick="abrirReagendar(${i})">🕐 ${p.status==='reagendada'?'Mudar quando eu volto':'Deu problema, fica pra depois'}</button>
           <button type="button" class="btntirar" data-confirmando="0" onclick="removerParada(${i}, this)">🗑️ Tirar da rota</button>
           <div id="motivos-${i}"></div>`}
    </div>`;
  }).join('') || '<div class="empty">Sem paradas.</div>';
}

function falar(texto){
  if(!window.speechSynthesis){ alert('Seu celular não suporta isso.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR';
  speechSynthesis.speak(u);
}
function ouvirEndereco(i){
  const c = rom.paradas[i].cliente || {};
  // Falado na ordem de quem dirige, igual ao que está escrito na tela: ouvir uma
  // ordem e ler outra é o tipo de coisa que faz errar de quadra.
  falar(Endereco.enderecoEmLinha(c, ', ') || 'Endereço não informado');
}
function ouvirTelefone(i){
  const tel = ((rom.paradas[i].cliente||{}).telefone||'').replace(/\D/g,'');
  falar(tel ? tel.split('').join(' ') : 'Telefone não informado');
}

function geo(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}),
      () => res(null), {timeout:6000, enableHighAccuracy:true});
  });
}

// "Não entreguei" abre estas opções em botão — nada de digitar motivo no celular.
// Tem que bater com MOTIVOS_FALHA em api/parada-status.js.
const MOTIVOS_FALHA = ['Cliente não estava em casa', 'Erro da loja', 'Endereço errado'];

// Problemas que NÃO encerram a entrega: ela fica devendo e volta na mesma rota.
// Tem que bater com MOTIVOS_REAGENDAR em api/parada-status.js.
const MOTIVOS_REAGENDAR = [
  'Ninguém em casa agora',
  'Não coube na passagem',
  'Cliente pediu pra deixar pra depois',
  'Faltou quem ajudasse a subir',
  'Cheguei fora do horário combinado'
];
const JANELAS = [
  { valor:'tarde',          rotulo:'Hoje à tarde' },
  { valor:'manha_seguinte', rotulo:'Amanhã de manhã' }
];
const rotuloJanela = v => (JANELAS.find(j=>j.valor===v)||{}).rotulo || '';

function abrirMotivos(i){
  const caixa = document.getElementById('motivos-'+i);

  caixa.innerHTML = `
    <div class="caixamotivo">
      <div class="tituloMotivo">Por que não deu pra entregar?</div>
      ${MOTIVOS_FALHA.map((m,k)=>`<button type="button" class="opcaomotivo" onclick="marcar(${i},'falhou',${k})">${esc(m)}</button>`).join('')}
      <button type="button" class="cancelamotivo" onclick="abrirMotivos(${i})">Cancelar</button>
    </div>`;
}

// Fica pra depois: dois toques. Primeiro o problema, depois quando volta.
// Sem caixa de diálogo, igual ao resto do app.

function escolherJanela(i, indiceMotivo){

/* Quais paradas já ouviram "tire a foto primeiro".

   Vive na memória da página, de propósito. Se sobrevivesse ao recarregamento, o
   freteiro que fechasse o app e voltasse confirmaria de primeira — que é
   exatamente o que este pedaço existe pra impedir. */
const insistiuSemFoto = new Set();

async function marcar(i, status, indiceMotivo, janela){
  const botao = document.getElementById(status==='entregue'?'btnok-'+i:'btnno-'+i);
  if(botao && botao.disabled) return; // trava clique duplo (e também trava se faltar vidro/assinatura)
  const parada = rom.paradas[i];

  /* A primeira tentativa de dar como entregue NÃO confirma: pede a foto.

     A foto do produto na casa do cliente é a única prova de que a entrega saiu
     do jeito que devia. Quando ela é só um botão opcional ao lado do "Entreguei",
     ninguém tira — aperta o verde e segue pra próxima.

     Aqui a ordem se inverte: o verde não fecha de primeira. Quem tirou a foto
     passa direto (não é castigo, é lembrete). Quem não tirou ouve uma vez, e no
     segundo toque passa mesmo assim — porque tem entrega que não dá pra
     fotografar, e travar de vez deixaria o freteiro preso na rua. */
  if (status === 'entregue') {
    const temFoto = (parada.fotos || []).some(f => f.tipo === 'produto');
    if (!temFoto && !insistiuSemFoto.has(parada.id)) {
      insistiuSemFoto.add(parada.id);
      const aviso = document.getElementById('motivos-' + i);
      if (aviso) {
        aviso.innerHTML = `<div class="pedefoto">
          📷 Tire a foto do produto na casa do cliente antes de fechar.
          <div class="pedefoto-sub">É o que prova que a entrega saiu certa. Se não der pra fotografar, toque em "Entreguei" de novo.</div>
        </div>`;
      }
      if (botao) botao.textContent = '✓ Entreguei mesmo assim';
      return;
    }
  }
  let body = { paradaId: parada.id, status };
  if(status === 'falhou') body.motivo = MOTIVOS_FALHA[indiceMotivo] || MOTIVOS_FALHA[0];
  if(status === 'reagendada'){
    body.motivo = MOTIVOS_REAGENDAR[indiceMotivo] || MOTIVOS_REAGENDAR[0];
    body.janela = janela;
  }
  const caixa = document.getElementById('motivos-'+i);
  if(caixa) caixa.innerHTML = '';
  const btnDepois = document.getElementById('btndepois-'+i);
  if(btnDepois) btnDepois.disabled = true;
  if(botao){ document.getElementById('btnok-'+i).disabled = true; document.getElementById('btnno-'+i).disabled = true; }
  const g = await geo();
  if(g){ body.lat = g.lat; body.lng = g.lng; }
  try{
    await api('/api/parada-status', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    await carregar();
  }catch(e){
    if(e instanceof ErroOffline){
      parada.status = status;
      if(status==='entregue') parada.entregue_em = new Date().toISOString();
      if(status==='falhou') parada.motivo = body.motivo;
      if(status==='reagendada'){ parada.motivo = body.motivo; parada.janela = body.janela; }
      enfileirar({ url: '/api/parada-status', body, token: localStorage.getItem('equipeToken') });
      localStorage.setItem('romCache_'+idAtual, JSON.stringify(rom));
      toast('Sem internet — salvo no celular, será enviado quando voltar o sinal');
      render();
    } else {
      alert('Falha ao salvar: ' + e.message);
      render();
    }
  }
}

/* Chamado depois que a foto do produto sobe. Some o aviso e devolve o botão ao
   normal — quem acabou de fotografar não pode continuar lendo "tire a foto". */
function liberouPelaFoto(paradaId){
  insistiuSemFoto.delete(paradaId);
}

async function desfazer(i){
  const parada = rom.paradas[i];

  try{

  }catch(e){ alert('Não foi possível desfazer: ' + e.message); }
}

function redimensionarImagem(file, maxLado){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxLado){ height = Math.round(height * maxLado/width); width = maxLado; }
      else if(height > maxLado){ width = Math.round(width * maxLado/height); height = maxLado; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function enviarFoto(paradaId, file){
  if(!file) return;
  try{
    const imagemBase64 = await redimensionarImagem(file, 1280);
    await api('/api/foto-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, imagemBase64 }) });
    liberouPelaFoto(paradaId);
    await carregar();
  }catch(e){
    if(e instanceof ErroOffline) toast('Sem internet — a foto não pôde ser enviada agora. Tente de novo com sinal.');
    else alert('Falha ao enviar a foto: ' + e.message);
  }
}

function abrirAssinatura(i){
  const box = document.getElementById('assinaturabox-'+i);
  if(!box) return;
  // Fechando: devolve a rolagem do fundo, que foi travada ao abrir.
  if(box.innerHTML){ box.innerHTML = ''; document.body.style.overflow = ''; return; }
  // Em tela cheia, o fundo rolando atrás faz o dedo arrastar a página em vez de
  // desenhar quando o traço passa da borda do canvas.
  document.body.style.overflow = 'hidden';
  box.innerHTML = `
    <div class="painelassinatura">
      <div class="tituloAssinatura">Peça pro cliente assinar aqui, confirmando que recebeu o vidro em bom estado:</div>
      <canvas class="canvasassinatura" id="canvasAssinatura-${i}"></canvas>
      <div class="botoesassinatura">
        <button type="button" class="limparassinatura" onclick="limparAssinatura(${i})">Limpar</button>
        <button type="button" class="confirmarassinatura" onclick="confirmarAssinatura(${i})">✓ Confirmar assinatura</button>
      </div>
      <button type="button" class="cancelarassinatura" onclick="abrirAssinatura(${i})">Cancelar</button>
    </div>`;
  configurarCanvasAssinatura(i);
}

// Desenho simples com o dedo (canvas nativo do navegador — sem custo nenhum).
// O canvas tem que nascer no tamanho real exibido, senão o traço fica borrado ou
// desalinhado do dedo em telas com pixel density diferente.
function configurarCanvasAssinatura(i){
  const canvas = document.getElementById('canvasAssinatura-'+i);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#14140F'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  canvas.dataset.assinado = '0';

  const posicao = e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  let desenhando = false, ultimo = null;
  const iniciar = e => { desenhando = true; canvas.dataset.assinado = '1'; ultimo = posicao(e); e.preventDefault(); };
  const mover = e => {
    if(!desenhando) return;
    const p = posicao(e);
    ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimo = p; e.preventDefault();
  };
  const parar = () => { desenhando = false; };
  canvas.addEventListener('mousedown', iniciar);
  canvas.addEventListener('mousemove', mover);
  canvas.addEventListener('mouseup', parar);
  canvas.addEventListener('mouseleave', parar);
  canvas.addEventListener('touchstart', iniciar, { passive:false });
  canvas.addEventListener('touchmove', mover, { passive:false });
  canvas.addEventListener('touchend', parar);
}

function limparAssinatura(i){
  const canvas = document.getElementById('canvasAssinatura-'+i);
  if(!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.assinado = '0';
}

async function confirmarAssinatura(i){
  const canvas = document.getElementById('canvasAssinatura-'+i);
  if(!canvas) return;
  if(canvas.dataset.assinado !== '1'){ toast('Peça pro cliente assinar antes de confirmar'); return; }
  const paradaId = rom.paradas[i].id;
  const imagemBase64 = canvas.toDataURL('image/png');
  try{
    await api('/api/foto-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, imagemBase64, tipo:'assinatura' }) });
    // Devolve a rolagem ANTES do carregar(): ele redesenha a lista e o painel
    // de assinatura some, levando junto o botao de cancelar que faria isso.
    document.body.style.overflow = '';
    toast('Assinatura salva!');
    await carregar();
  }catch(e){
    if(e instanceof ErroOffline) toast('Sem internet — a assinatura não pôde ser enviada agora. Tente de novo com sinal.');
    else alert('Falha ao salvar a assinatura: ' + e.message);
  }
}
