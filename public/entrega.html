<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Entregas — Outlet dos Móveis DB</title>
<link rel="icon" href="/logo.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f4f0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#14140F;padding-bottom:30px}
header{background:#14140F;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
.hcima{display:flex;align-items:center;gap:10px}
.hcima img{width:36px;height:36px;border-radius:7px;flex:0 0 auto}
header h1{font-size:17px;margin:0;flex:1;min-width:0}
header p{margin:6px 0 0;font-size:13px;color:#c9c9bd}
.prog{height:6px;background:#ffffff26;border-radius:3px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:#F2F250;width:0;transition:.3s}
main{padding:12px}
.p{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #e2e2d9}
.p.done{opacity:.6}
.p .n{display:inline-block;background:#efefe6;color:#6f6f66;font-weight:700;font-size:13px;padding:3px 10px;border-radius:20px}
.p .n.dest{background:#F2F250;color:#14140F}
.p h3{margin:10px 0 4px;font-size:24px;line-height:1.2}
.p .end{color:#57574e;font-size:15px}
.p .itens{margin:10px 0;padding:10px 12px;background:#fafaf4;border:1px solid #eaeadf;border-radius:9px;font-size:14px}
.acoes{display:flex;gap:8px;margin-top:12px}
button{flex:1;padding:14px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;font-size:15px}
.ok{background:#0f8a4a;color:#fff}
.no{background:#fff;color:#b91c1c;border:2px solid #f0c9c9}
.contatos{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.botaogrande{flex:1;min-width:80px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 6px;border-radius:12px;font-weight:700;font-size:12px;color:#fff}
.botaogrande .emoji{font-size:26px}
.bmapa{background:#14140F}
.btel{background:#0f8a4a}
.bwpp{background:#25d366}
.bouvir{background:#6f6f66}
.maprota{background:#F2F250;color:#14140F;text-decoration:none;display:block;text-align:center;padding:15px;border-radius:11px;margin:0 12px 10px;font-weight:800;font-size:16px}
.status{margin-top:10px;font-size:15px;font-weight:700}
.status.ok{background:none;color:#0f8a4a}
.status.no{background:none;color:#b91c1c;border:0}
.empty{text-align:center;padding:40px;color:#6f6f66}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fotos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.btnfoto{background:#fff;color:#14140F;border:2px solid #14140F;margin-top:10px}
.btndesfazer{background:#fff;color:#6f6f66;border:1px solid #ddd;margin-top:8px;font-size:13px;padding:10px}
/* Opções de "não entreguei" — botão grande, sem digitar nada no celular. */
.caixamotivo{margin-top:10px;background:#fafaf4;border:2px solid #e2e2d9;border-radius:12px;padding:12px}
.tituloMotivo{font-size:13px;font-weight:800;color:#57574e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.opcaomotivo{width:100%;background:#fff;color:#14140F;border:2px solid #14140F;margin-bottom:8px;padding:15px;font-size:15px}
.cancelamotivo{width:100%;background:none;color:#6f6f66;border:0;padding:8px;font-size:14px;font-weight:600}
.err{background:#fdeaea;color:#7f1d1d;padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:10px}
.rota{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #e2e2d9;border-left:5px solid #F2F250;text-decoration:none;display:block;color:inherit}
.avisoOffline{background:#7a5416;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600}
/* Mostrinha de cor: borda escura sempre, senão "Branco" some no fundo branco. */
.sw{display:inline-block;width:18px;height:18px;border-radius:5px;border:1.5px solid #9a9a8e;vertical-align:-4px;margin-right:6px}
/* Vidro/frágil e recado do gerente: o freteiro precisa ver isso ANTES de pegar a peça. */
.avisovidro{margin-top:11px;background:#fdeaea;border:2px solid #eba9a9;color:#7f1d1d;border-radius:11px;padding:12px 13px;font-size:15px;font-weight:800}
.avisovidro .quais{font-weight:600;font-size:13px;margin-top:4px}
.obsfreteiro{margin-top:10px;background:#fff8e1;border:1px solid #f0e0a8;border-radius:9px;padding:11px 12px;font-size:14px;font-weight:600}
/* Passos obrigatórios pra entregar um item com vidro: foto + assinatura do cliente. */
.vidrocheck{margin-top:11px;background:#fdeaea;border:2px solid #eba9a9;border-radius:12px;padding:12px}
.vidrocheck-titulo{font-size:13px;font-weight:800;color:#7f1d1d;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
.passovidro{width:100%;background:#fff;color:#14140F;border:2px solid #14140F;margin-bottom:8px;padding:14px;font-size:15px}
.passovidro.feito{background:#e3f6ec;color:#0f8a4a;border-color:#0f8a4a;opacity:1}
.passovidro:last-child{margin-bottom:0}
button.ok:disabled{background:#e2e2d9;color:#9a9a8e}
.painelassinatura{margin-top:10px;background:#fafaf4;border:2px solid #e2e2d9;border-radius:12px;padding:12px}
.tituloAssinatura{font-size:14px;font-weight:700;margin-bottom:9px}
#tela-app canvas.canvasassinatura{width:100%;height:180px;display:block;border:2px solid #14140F;border-radius:10px;background:#fff;touch-action:none}
.botoesassinatura{display:flex;gap:8px;margin-top:10px}
.limparassinatura{background:#fff;color:#6f6f66;border:1px solid #ddd;flex:0 0 auto;width:auto;padding:12px 16px}
.confirmarassinatura{background:#0f8a4a;color:#fff}
.cancelarassinatura{width:100%;background:none;color:#6f6f66;border:0;padding:8px;font-size:14px;font-weight:600;margin-top:4px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14140F;color:#F2F250;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="tela-app" hidden>
<div id="avisoOffline" class="avisoOffline" hidden></div>
<header>
  <div class="hcima">
    <img src="/logo.svg" alt="Outlet dos Móveis DB">
    <h1 id="titulo">Carregando…</h1>
    <button id="btnSair" style="width:auto;flex:none;padding:7px 11px;font-size:12px;background:#ffffff26;color:#fff">Sair</button>
  </div>
  <p id="sub"></p>
  <div class="prog"><i id="bar"></i></div>
</header>
<div id="rotaCompleta"></div>
<main id="lista"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const ESTOQUE = { nome: 'Estoque', endereco: 'R. Márcia Travassos, 660 - Jardim Jerico, Cabedelo - PB, 58103-718' };

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rom = null, idAtual = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }

function corParaSwatch(nome){
  const n = (nome||'').trim().toLowerCase();
  if(n==='branco') return '#ffffff';
  if(n==='off') return '#efe6d3';
  if(n==='nature') return '#a3744f';
  if(n==='nature/off') return 'linear-gradient(135deg,#a3744f 60%,#efe6d3 60%)';
  if(n==='off/nature') return 'linear-gradient(135deg,#a3744f 40%,#efe6d3 40%)';
  return n ? '#cbd5e1' : 'transparent';
}

class ErroOffline extends Error {}
async function api(url, opt){
  const token = localStorage.getItem('equipeToken');
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, token ? { Authorization: 'Bearer ' + token } : {});
  let r;
  try{ r = await fetch(url, opt); }
  catch(e){ throw new ErroOffline('sem conexão'); }
  // Sessão morreu (login removido do cadastro, por ex.): volta pro início em vez de
  // deixar a pessoa presa numa tela de erro que ela não sabe resolver.
  if(r.status === 401){
    localStorage.removeItem('equipeToken'); localStorage.removeItem('equipeTipo');
    location.href = '/equipe';
    throw new Error('sessão expirada');
  }
  const j = await r.json().catch(()=>({erro:'resposta inválida'}));
  if(!r.ok) throw new Error(j.erro || ('HTTP '+r.status));
  return j;
}

/* ---------------- fila offline: ações que não puderam ser enviadas ---------------- */
function filaOffline(){ try{ return JSON.parse(localStorage.getItem('filaOffline')||'[]'); }catch(e){ return []; } }
function salvarFila(f){ localStorage.setItem('filaOffline', JSON.stringify(f)); atualizarAvisoOffline(); }
function enfileirar(acao){ const f = filaOffline(); f.push(acao); salvarFila(f); }
function atualizarAvisoOffline(){
  const n = filaOffline().length;
  const el = document.getElementById('avisoOffline');
  el.hidden = n === 0;
  if(n) el.textContent = `📶 Sem internet — ${n} ação(ões) salva(s) no celular, serão enviadas quando o sinal voltar`;
}
async function processarFila(){
  const f = filaOffline();
  if(!f.length) return;
  const restam = [];
  for(const acao of f){
    try{ await fetch(acao.url, { method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+acao.token}, body: JSON.stringify(acao.body) }); }
    catch(e){ restam.push(acao); }
  }
  salvarFila(restam);
  if(restam.length < f.length){ toast('Ações pendentes enviadas!'); if(idAtual) carregar(); }
}
window.addEventListener('online', processarFila);

// Sem token? Manda pra /equipe, que é a única porta de entrada da equipe.
function checarSessao(){
  if(!localStorage.getItem('equipeToken')){ location.href = '/equipe'; return; }
  document.getElementById('tela-app').hidden = false;
  atualizarAvisoOffline(); processarFila(); iniciar();
}

document.getElementById('btnSair').onclick = () => {
  if(!confirm('Sair do app?')) return;
  localStorage.removeItem('equipeToken'); localStorage.removeItem('equipeTipo');
  location.href = '/equipe';
};

// Mostra as rotas de HOJE EM DIANTE — não some se você já criou a rota de amanhã.
async function iniciar(){
  try{
    const rotas = await api('/.netlify/functions/minhas-rotas');
    if(!rotas.length){
      document.getElementById('titulo').textContent = 'Sem rota';
      document.getElementById('sub').textContent = '';
      document.getElementById('lista').innerHTML = '<div class="empty">Nenhuma rota agendada pra você ainda. Fale com o gerente.</div>';
      return;
    }
    if(rotas.length === 1){ idAtual = rotas[0].id; await carregar(); return; }
    document.getElementById('titulo').textContent = 'Suas rotas';
    document.getElementById('sub').textContent = 'Você tem mais de uma rota agendada — escolha uma:';
    document.getElementById('lista').innerHTML = rotas.map(r => `
      <a class="rota" href="#" onclick="abrirRota('${r.id}');return false;">
        <span class="n">${esc(r.codigo)}</span>
        <div class="end">${esc(r.data||'')} · ${r.entregues}/${r.totalParadas} entregues</div>
      </a>`).join('');
  }catch(e){
    document.getElementById('titulo').textContent = 'Sem internet';
    document.getElementById('lista').innerHTML = '<div class="empty">Não deu pra carregar a rota de hoje. Assim que voltar o sinal, tente de novo.</div>';
  }
}
function abrirRota(id){ idAtual = id; carregar(); }

async function carregar(){
  try{
    rom = await api('/.netlify/functions/romaneio-publico?id='+idAtual);
    localStorage.setItem('romCache_'+idAtual, JSON.stringify(rom));
    render();
  }catch(e){
    const cache = localStorage.getItem('romCache_'+idAtual);
    if(cache){ rom = JSON.parse(cache); render(); toast('Sem internet — mostrando a última rota salva no celular'); }
    else{ document.getElementById('titulo').textContent = 'Erro'; document.getElementById('lista').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  }
}

function linkRotaCompleta(){
  const enderecos = rom.paradas.map(p => {
    const c = p.cliente || {};
    return [c.endereco, c.complemento, c.bairro, c.cidade, c.estado, c.cep].filter(Boolean).join(', ');
  }).filter(Boolean);
  if(!enderecos.length) return '';
  const destino = enderecos[enderecos.length-1];
  const waypoints = enderecos.slice(0, -1).map(encodeURIComponent).join('|');
  const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(ESTOQUE.endereco)}&destination=${encodeURIComponent(destino)}`;
  return waypoints ? url + `&waypoints=${waypoints}` : url;
}

function render(){
  const ok = rom.paradas.filter(p=>p.status==='entregue'||p.status==='falhou').length;
  document.getElementById('titulo').textContent = 'Romaneio ' + rom.codigo;
  document.getElementById('sub').textContent =
    (rom.freteiro ? rom.freteiro.nome + ' · ' : '') + rom.data + ' · ' + ok + '/' + rom.paradas.length + ' concluídas';
  document.getElementById('bar').style.width = (rom.paradas.length ? ok/rom.paradas.length*100 : 0) + '%';

  const rotaLink = linkRotaCompleta();
  document.getElementById('rotaCompleta').innerHTML = rotaLink
    ? `<a class="maprota" target="_blank" href="${rotaLink}">Abrir rotas no Maps</a>`
    : '';

  document.getElementById('lista').innerHTML = rom.paradas.map((p,i)=>{
    const c = p.cliente || {};
    const end = [c.endereco, c.complemento, c.bairro].filter(Boolean).join(', ');
    const cid = [c.cidade, c.estado].filter(Boolean).join('/');
    const q = encodeURIComponent([end, cid, c.cep].filter(Boolean).join(', '));
    const telLimpo = (c.telefone||'').replace(/\D/g,'');
    const itens = (p.itens||[]).map(it=>`<div>${it.cor?`<span class="sw" style="background:${corParaSwatch(it.cor)}"></span>`:''}${esc(it.quantidade)}x ${esc(it.descricao)}${it.cor?` — <b>${esc(it.cor)}</b>`:''}${it.fragil?' <b style="color:#b91c1c">🔴 VIDRO</b>':''}</div>`).join('');
    const comVidro = (p.itens||[]).filter(it=>it.fragil);
    const fotoVidroFeita = (p.fotos||[]).some(f=>f.tipo==='vidro');
    const assinaturaFeita = (p.fotos||[]).some(f=>f.tipo==='assinatura');
    const faltaVidro = comVidro.length > 0 && (!fotoVidroFeita || !assinaturaFeita);
    const feito = p.status === 'entregue' || p.status === 'falhou';
    const rotulo = p.tipo==='assistencia' ? 'Assistência' : (p.tipo==='nf' ? 'NF' : 'Pedido');
    const fotos = (p.fotos||[]).map(f=>`<a href="${f.url}" target="_blank"><img src="${f.url}"></a>`).join('');
    return `<div class="p ${feito?'done':''}">
      <span class="n dest">${i+1} de ${rom.paradas.length}</span>
      <span class="n">${rotulo}${p.numero?' '+esc(p.numero):''} · ${p.volumes||0} vol.</span>
      ${p.status==='em_rota'?'<span class="n">Em rota</span>':''}
      <h3>${esc(c.nome||'(sem cliente)')}</h3>
      <div class="end">${esc(end||'endereço não informado')}${cid?' · '+esc(cid):''}${c.cep?' · '+esc(c.cep):''}</div>
      ${comVidro.length?`<div class="avisovidro">🔴 VAI COM VIDRO — cuidado no transporte e na descida<div class="quais">${comVidro.map(it=>esc(it.descricao)).join(' · ')}</div></div>`:''}
      ${itens?`<div class="itens">${itens}</div>`:''}
      ${p.observacao?`<div class="obsfreteiro">📌 Recado do gerente: ${esc(p.observacao)}</div>`:''}
      <div class="contatos">
        ${end?`<a class="botaogrande bmapa" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${q}"><span class="emoji">📍</span>Mapa</a>`:''}
        ${telLimpo?`<a class="botaogrande btel" href="tel:${telLimpo}"><span class="emoji">📞</span>Ligar</a>`:''}
        ${telLimpo?`<a class="botaogrande bwpp" target="_blank" href="https://wa.me/55${telLimpo}"><span class="emoji">💬</span>WhatsApp</a>`:''}
      </div>
      <div class="contatos">
        <button type="button" class="botaogrande bouvir" onclick="ouvirEndereco(${i})"><span class="emoji">🔊</span>Ouvir endereço</button>
        ${telLimpo?`<button type="button" class="botaogrande bouvir" onclick="ouvirTelefone(${i})"><span class="emoji">🔊</span>Ouvir telefone</button>`:''}
      </div>
      <div class="fotos">${fotos}</div>
      <button class="btnfoto" onclick="document.getElementById('foto-${p.id}').click()">📷 Enviar foto</button>
      <input type="file" id="foto-${p.id}" accept="image/*" capture="environment" style="display:none" onchange="enviarFoto('${p.id}', this.files[0])">
      ${(!feito && comVidro.length) ? `
      <div class="vidrocheck">
        <div class="vidrocheck-titulo">📋 Antes de entregar (tem vidro):</div>
        <button type="button" class="passovidro ${fotoVidroFeita?'feito':''}" onclick="document.getElementById('fotovidro-${p.id}').click()" ${fotoVidroFeita?'disabled':''}>
          ${fotoVidroFeita ? '✓ Foto do vidro guardada' : '📷 Tirar foto do vidro'}
        </button>
        <input type="file" id="fotovidro-${p.id}" accept="image/*" capture="environment" style="display:none" onchange="enviarFotoVidro('${p.id}', this.files[0])">
        <button type="button" class="passovidro ${assinaturaFeita?'feito':''}" onclick="abrirAssinatura(${i})" ${assinaturaFeita?'disabled':''}>
          ${assinaturaFeita ? '✓ Assinatura do cliente colhida' : '✍️ Colher assinatura do cliente'}
        </button>
        <div id="assinaturabox-${i}"></div>
      </div>` : ''}
      ${feito
        ? `<div class="status ${p.status==='entregue'?'ok':'no'}">${p.status==='entregue'?'✓ Entregue':'✕ Não entregue'}${p.recebedor?' — '+esc(p.recebedor):''}${p.motivo?' — '+esc(p.motivo):''}<br><small>${p.entregue_em?new Date(p.entregue_em).toLocaleString('pt-BR'):''}</small></div>
           <button class="btndesfazer" onclick="desfazer(${i})">↩️ Desfazer</button>`
        : `<div class="acoes">
             <button class="ok" id="btnok-${i}" onclick="marcar(${i},'entregue')" ${faltaVidro?'disabled title="Tire a foto do vidro e colha a assinatura antes"':''}>✓ Entreguei</button>
             <button class="no" id="btnno-${i}" onclick="abrirMotivos(${i})">✕ Não entreguei</button>
           </div>
           <div id="motivos-${i}"></div>`}
    </div>`;
  }).join('') || '<div class="empty">Sem paradas.</div>';
}

function falar(texto){
  if(!window.speechSynthesis){ alert('Seu celular não suporta isso.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR';
  speechSynthesis.speak(u);
}
function ouvirEndereco(i){
  const c = rom.paradas[i].cliente || {};
  falar([c.endereco, c.complemento, c.bairro, c.cidade, c.estado].filter(Boolean).join(', ') || 'Endereço não informado');
}
function ouvirTelefone(i){
  const tel = ((rom.paradas[i].cliente||{}).telefone||'').replace(/\D/g,'');
  falar(tel ? tel.split('').join(' ') : 'Telefone não informado');
}

function geo(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}),
      () => res(null), {timeout:6000, enableHighAccuracy:true});
  });
}

// "Não entreguei" abre estas opções em botão — nada de digitar motivo no celular.
// Tem que bater com MOTIVOS_FALHA em netlify/functions/parada-status.js.
const MOTIVOS_FALHA = ['Cliente não estava em casa', 'Erro da loja', 'Remarcado pra outro dia'];

function abrirMotivos(i){
  const caixa = document.getElementById('motivos-'+i);
  if(!caixa) return;
  if(caixa.innerHTML){ caixa.innerHTML = ''; return; }
  caixa.innerHTML = `
    <div class="caixamotivo">
      <div class="tituloMotivo">Por que não deu pra entregar?</div>
      ${MOTIVOS_FALHA.map((m,k)=>`<button type="button" class="opcaomotivo" onclick="marcar(${i},'falhou',${k})">${esc(m)}</button>`).join('')}
      <button type="button" class="cancelamotivo" onclick="abrirMotivos(${i})">Cancelar</button>
    </div>`;
}

async function marcar(i, status, indiceMotivo){
  const botao = document.getElementById(status==='entregue'?'btnok-'+i:'btnno-'+i);
  if(botao && botao.disabled) return; // trava clique duplo (e também trava se faltar vidro/assinatura)
  const parada = rom.paradas[i];
  let body = { paradaId: parada.id, status };
  if(status === 'falhou') body.motivo = MOTIVOS_FALHA[indiceMotivo] || MOTIVOS_FALHA[0];
  const caixa = document.getElementById('motivos-'+i);
  if(caixa) caixa.innerHTML = '';
  if(botao){ document.getElementById('btnok-'+i).disabled = true; document.getElementById('btnno-'+i).disabled = true; }
  const g = await geo();
  if(g){ body.lat = g.lat; body.lng = g.lng; }
  try{
    await api('/.netlify/functions/parada-status', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    await carregar();
  }catch(e){
    if(e instanceof ErroOffline){
      parada.status = status;
      if(status==='entregue') parada.entregue_em = new Date().toISOString();
      if(status==='falhou') parada.motivo = body.motivo;
      enfileirar({ url: '/.netlify/functions/parada-status', body, token: localStorage.getItem('equipeToken') });
      localStorage.setItem('romCache_'+idAtual, JSON.stringify(rom));
      toast('Sem internet — salvo no celular, será enviado quando voltar o sinal');
      render();
    } else {
      alert('Falha ao salvar: ' + e.message);
      render();
    }
  }
}

async function desfazer(i){
  const parada = rom.paradas[i];

  try{

    toast('Desfeito');
  }catch(e){ alert('Não foi possível desfazer: ' + e.message); }
}

function redimensionarImagem(file, maxLado){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxLado){ height = Math.round(height * maxLado/width); width = maxLado; }
      else if(height > maxLado){ width = Math.round(width * maxLado/height); height = maxLado; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function enviarFoto(paradaId, file){
  if(!file) return;
  try{
    const imagemBase64 = await redimensionarImagem(file, 1280);
    await api('/.netlify/functions/foto-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, imagemBase64 }) });
    await carregar();
  }catch(e){
    if(e instanceof ErroOffline) toast('Sem internet — a foto não pôde ser enviada agora. Tente de novo com sinal.');
    else alert('Falha ao enviar a foto: ' + e.message);
  }
}

function abrirAssinatura(i){
  const box = document.getElementById('assinaturabox-'+i);
  if(!box) return;
  if(box.innerHTML){ box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="painelassinatura">
      <div class="tituloAssinatura">Peça pro cliente assinar aqui, confirmando que recebeu o vidro em bom estado:</div>
      <canvas class="canvasassinatura" id="canvasAssinatura-${i}"></canvas>
      <div class="botoesassinatura">
        <button type="button" class="limparassinatura" onclick="limparAssinatura(${i})">Limpar</button>
        <button type="button" class="confirmarassinatura" onclick="confirmarAssinatura(${i})">✓ Confirmar assinatura</button>
      </div>
      <button type="button" class="cancelarassinatura" onclick="abrirAssinatura(${i})">Cancelar</button>
    </div>`;
  configurarCanvasAssinatura(i);
}

// Desenho simples com o dedo (canvas nativo do navegador — sem custo nenhum).
// O canvas tem que nascer no tamanho real exibido, senão o traço fica borrado ou
// desalinhado do dedo em telas com pixel density diferente.
function configurarCanvasAssinatura(i){
  const canvas = document.getElementById('canvasAssinatura-'+i);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#14140F'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  canvas.dataset.assinado = '0';

  const posicao = e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  let desenhando = false, ultimo = null;
  const iniciar = e => { desenhando = true; canvas.dataset.assinado = '1'; ultimo = posicao(e); e.preventDefault(); };
  const mover = e => {
    if(!desenhando) return;
    const p = posicao(e);
    ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimo = p; e.preventDefault();
  };
  const parar = () => { desenhando = false; };
  canvas.addEventListener('mousedown', iniciar);
  canvas.addEventListener('mousemove', mover);
  canvas.addEventListener('mouseup', parar);
  canvas.addEventListener('mouseleave', parar);
  canvas.addEventListener('touchstart', iniciar, { passive:false });
  canvas.addEventListener('touchmove', mover, { passive:false });
  canvas.addEventListener('touchend', parar);
}

function limparAssinatura(i){
  const canvas = document.getElementById('canvasAssinatura-'+i);
  if(!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.assinado = '0';
}

async function confirmarAssinatura(i){
  const canvas = document.getElementById('canvasAssinatura-'+i);
  if(!canvas) return;
  if(canvas.dataset.assinado !== '1'){ toast('Peça pro cliente assinar antes de confirmar'); return; }
  const paradaId = rom.paradas[i].id;
  const imagemBase64 = canvas.toDataURL('image/png');
  try{
    await api('/.netlify/functions/foto-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ paradaId, imagemBase64, tipo:'assinatura' }) });
    toast('Assinatura salva!');
    await carregar();
  }catch(e){
    if(e instanceof ErroOffline) toast('Sem internet — a assinatura não pôde ser enviada agora. Tente de novo com sinal.');
    else alert('Falha ao salvar a assinatura: ' + e.message);
  }
}
